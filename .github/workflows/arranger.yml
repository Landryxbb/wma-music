name: Arranger WMA MUSIC

on:
  push:
    paths:
      - '.github/workflows/arranger.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arranger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ranger les fichiers
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          for f in index*.html*; do
            if grep -q "sunSpin" "$f"; then
              [ "$f" != "index.html" ] && cp "$f" index.html
              break
            fi
          done
          for f in index*.html*; do [ "$f" != "index.html" ] && git rm -q "$f"; done
          for n in "icon.svg" "icon-192.png" "icon-512.png"; do
            base="${n%.*}"; ext="${n##*.}"
            for f in "$base ("*")."$ext; do mv -f "$f" "$n"; done
          done
          if [ -f geo.js ]; then mkdir -p api; git mv -f geo.js api/geo.js; fi
          mkdir -p artists
          for f in *.jpg *.jpeg *.webp; do git mv -f "$f" "artists/$f"; done
          mkdir -p supabase
          for f in *.sql; do git mv -f "$f" "supabase/$f"; done
          git add -A
          git status --short

      - name: Enregistrer
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "Rien a ranger : tout est deja en place."
            exit 0
          fi
          git config user.name "Landryxbb"
          git config user.email "landryxbb0@gmail.com"
          git commit -m "Ranger les fichiers (page, icones, api, artists, supabase)"
          git push
