<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WMA MUSIC</title>
<meta name="description" content="WMA MUSIC — free music streaming from African artists. YOUR MUSIC. YOUR AFRICA. YOUR SOUND.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WMA MUSIC">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-512.png">
<meta property="og:title" content="WMA MUSIC">
<meta property="og:description" content="YOUR MUSIC. YOUR AFRICA. YOUR SOUND.">
<meta property="og:image" content="/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout façon Apple Music : barre latérale translucide + grands titres + lecteur flottant en verre dépoli ; charte WMA orange et noir */
:root{
  --bg:#000000; --surface:#121212; --surface2:#1C1C1E; --line:#2C2C2E;
  --fg:#FFFFFF; --muted:#8E8E93; --accent:#FF7A1A; --accent-ink:#0A0A0A; --accent-soft:rgba(255,122,26,.16);
  --good:#32D74B; --warn:#FFD60A; --bad:#FF453A;
  --display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Manrope", "Segoe UI", Roboto, sans-serif;
  --body:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Manrope", "Segoe UI", Roboto, sans-serif;
  --mono:"SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
  --side:260px; --player:80px; --tabs:60px; --r:8px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{display:block}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ---------- Rail latéral ---------- */
.side{position:fixed;top:0;left:0;bottom:var(--player);width:var(--side);background:var(--surface);border-right:1px solid var(--line);padding:calc(22px + env(safe-area-inset-top,0px)) 16px 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px;z-index:20;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px}
.logo b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1}
.logo small{display:block;font-size:9.5px;letter-spacing:.18em;color:var(--muted);font-weight:600;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:600;font-size:14px}
.nav a:hover{color:var(--fg);background:var(--surface2)}
.nav a.on{color:var(--fg);background:var(--accent-soft)}
.nav a.on svg{color:var(--accent)}
.nav-label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 10px 6px}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--muted);line-height:1.6}

/* ---------- Barre supérieure ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;margin-left:var(--side);display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));background:rgba(0,0,0,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .logo{display:none}
.searchbox{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:40px;color:var(--muted)}
.searchbox input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit;font-size:14px}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;font-weight:700;font-size:13.5px;border:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.ghost{background:none}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.me{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px}

/* ---------- Scène ---------- */
main{margin-left:var(--side);padding-block:26px calc(var(--player) + 40px);padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-height:100vh}
.sec{margin-top:38px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{font-size:22px;font-weight:700}
.sec-h a{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.sec-h a:hover{color:var(--fg)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,176px);gap:18px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.rail>*{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end;padding:28px;border:1px solid var(--line);border-radius:16px;background:var(--surface);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;border:44px solid var(--accent-soft);pointer-events:none}
.slogan{font-family:var(--display);font-weight:800;font-size:clamp(34px,5.4vw,64px);line-height:.95;letter-spacing:-.03em;text-transform:uppercase}
.slogan span{display:block}
.slogan em{font-style:normal;color:var(--accent)}
.hero p{max-width:46ch;color:var(--muted);margin:18px 0 20px}
.feat{position:relative;z-index:1;display:flex;gap:16px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px}
.feat img{width:96px;height:96px;border-radius:8px;object-fit:cover;flex:none}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800}

/* Cartes */
.card{display:flex;flex-direction:column;gap:9px;min-width:0}
.cov{position:relative;aspect-ratio:1;max-width:100%;border-radius:var(--r);overflow:hidden;background:var(--surface2)}
.cov img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.card:hover .cov img{transform:scale(1.04)}
.cov .play{position:absolute;right:10px;bottom:10px;opacity:0;transform:translateY(6px);transition:.2s}
.card:hover .cov .play,.cov .play:focus-visible,.cov .play.is-on{opacity:1;transform:none}
@media (hover:none){.cov .play{opacity:1;transform:none}}
.pbtn{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.pbtn:hover{transform:scale(1.06)}
.card-t{display:flex;align-items:flex-start;gap:6px}
.card-t>div{flex:1;min-width:0}
.t1{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2 a:hover{color:var(--fg);text-decoration:underline}
.ic{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex:none}
.ic:hover{color:var(--fg);background:var(--surface2)}
.ic.on{color:var(--accent)}
.badge{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.1em;padding:2px 6px;border-radius:4px;background:var(--accent-soft);color:#FFB37A;vertical-align:middle}
.badge.off{background:rgba(255,92,122,.14);color:var(--bad)}
.badge.ok{background:rgba(61,214,140,.14);color:var(--good)}

/* Artistes */
.av{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:38px;color:#fff;background:radial-gradient(circle at 30% 25%,hsl(var(--h) 70% 52%),hsl(calc(var(--h) + 40) 60% 18%));overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.acard{text-align:center;display:flex;flex-direction:column;gap:9px;min-width:0}
.acard .t1,.acard .t2{text-align:center}

/* Listes de titres */
.tlist{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:28px 44px minmax(0,1fr) auto auto auto;align-items:center;gap:12px;padding:7px 8px;border-radius:8px}
.trow:hover{background:var(--surface2)}
.trow.cur .t1{color:var(--accent)}
.trow img{width:44px;height:44px;border-radius:6px;object-fit:cover}
.trow .n{color:var(--muted);text-align:center;font-size:13px}
.trow .d{color:var(--muted);font-size:12.5px}

/* En-tête de page (artiste, album, playlist) */
.phead{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line)}
.phead .art{width:200px;flex:none;max-width:100%}
.phead .art img{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.phead h1{font-size:clamp(30px,5vw,56px);font-weight:800;line-height:1}
.phead .meta{color:var(--muted);font-size:13.5px;margin-top:10px}
.phead .meta a{color:var(--fg);font-weight:700}
.phead .info{flex:1;min-width:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.bio{max-width:65ch;color:var(--muted);margin-top:12px}

/* Onglets / puces */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:12.5px;background:var(--surface)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.genres{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.genre{position:relative;height:96px;border-radius:12px;padding:14px;font-family:var(--display);font-weight:800;font-size:19px;overflow:hidden;text-align:left;background:hsl(var(--h) 55% 30%)}
.genre::after{content:"";position:absolute;right:-18px;bottom:-18px;width:76px;height:76px;border-radius:50%;border:14px solid rgba(255,255,255,.18)}

/* Formulaires */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.form{display:flex;flex-direction:column;gap:14px;max-width:440px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--surface2);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:inherit;font-size:14px;padding:10px 12px;width:100%}
.fld textarea{min-height:90px;resize:vertical}
.fld input[type=file]{padding:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted)}
.check input{margin-top:3px;accent-color:var(--accent)}
.err{color:var(--bad);font-size:13px;min-height:1em}
.auth{max-width:420px;margin:30px auto}
.auth h1{font-size:34px;margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{font-size:12.5px;color:var(--muted);border-left:2px solid var(--accent);padding:6px 0 6px 12px;max-width:72ch}

/* Admin */
.adm-nav{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 22px}
.adm-nav a{padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted);border:1px solid var(--line)}
.adm-nav a.on{color:var(--fg);background:var(--accent-soft);border-color:var(--accent)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td img{width:38px;height:38px;border-radius:6px;object-fit:cover;display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi b{display:block;font-family:var(--display);font-size:32px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:13px}
.bar i{display:block;height:6px;border-radius:3px;background:var(--accent);margin-top:5px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* ---------- Lecteur ---------- */
.player{position:fixed;left:0;right:0;bottom:0;height:calc(var(--player) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(22,22,24,.78);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:16px;z-index:30}
.p-now{display:flex;align-items:center;gap:12px;min-width:0}
.p-now img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:var(--surface2)}
.p-now>div{min-width:0}
.p-mid{display:flex;flex-direction:column;align-items:center;gap:6px}
.p-ctl{display:flex;align-items:center;gap:10px}
.p-ctl .ic{width:36px;height:36px}
.p-ctl .main{width:42px;height:42px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.p-ctl .main:hover{transform:scale(1.05)}
.p-prog{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;font-size:11.5px;color:var(--muted)}
.p-prog span{width:38px;text-align:center}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p,0%),var(--line) var(--p,0%));outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--fg);border:0}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--fg);border:0}
.p-right{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.p-right input{max-width:110px}
.p-mini-prog{display:none}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Page lecture */
.np{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:40px;align-items:start}
.np .bigcov{width:100%;aspect-ratio:1;border-radius:16px;object-fit:cover;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.np h1{font-size:clamp(28px,4vw,44px);font-weight:800;margin-top:22px}

/* ---------- Onglets mobiles ---------- */
.tabs{display:none}

/* Modale, toast */
.modal{position:fixed;inset:0;background:rgba(5,4,9,.72);z-index:80;display:grid;place-items:center;padding:16px}
.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:520px;max-height:86vh;overflow-y:auto}
.modal-box h3{font-size:20px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--player) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:13.5px;z-index:90;max-width:calc(100% - 32px);text-align:center}

/* ---------- Thème Apple Music (surcouche) ---------- */
h1,h2,h3{letter-spacing:-.022em}
.side{background:rgba(28,28,30,.72);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-right:1px solid rgba(255,255,255,.08)}
.logo b{font-weight:800;letter-spacing:-.03em}
.nav a{border-radius:7px;font-weight:500;color:var(--fg);font-size:14.5px}
.nav a svg{color:var(--accent)}
.nav a.on{background:rgba(255,255,255,.12)}
.nav-label{letter-spacing:.02em;text-transform:none;font-size:12px;font-weight:600}
.top{border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px)}
.searchbox{border-radius:9px;background:rgba(118,118,128,.24);border:0;height:36px}
.btn{border-radius:10px;border:0;background:rgba(118,118,128,.24);font-weight:600}
.btn:hover{background:rgba(118,118,128,.34)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;color:var(--accent)}
.ltitle{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:0 0 18px}
main h1[style*="font-size:34px"]{font-weight:800}
.sec{margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.sec-h h2{font-size:22px;font-weight:700}
.sec-h a{color:var(--accent);font-weight:500;letter-spacing:0;font-size:14px}
.sec-h a::after{content:" ›"}
.hero{background:linear-gradient(135deg,#2A1405 0%,#0D0703 55%,#000 100%);border:0;border-radius:14px}
.hero::after{border-color:rgba(255,122,26,.22)}
.slogan{text-transform:none;letter-spacing:-.04em;font-size:clamp(34px,5vw,58px);line-height:1}
.eyebrow{letter-spacing:.04em;font-size:11px;font-weight:700}
.feat{background:rgba(255,255,255,.06);border:0;backdrop-filter:blur(20px)}
.cov{border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.cov .play{left:10px;right:auto}
.pbtn{width:36px;height:36px;background:rgba(255,255,255,.85);color:#000;backdrop-filter:blur(10px)}
.t1{font-weight:500;font-size:13.5px}
.t2{font-size:13px}
.trow{border-radius:6px;padding:6px 10px;border-bottom:1px solid var(--line)}
.trow:hover{background:rgba(255,255,255,.06)}
.chip{border:0;background:rgba(118,118,128,.24);font-weight:600;border-radius:999px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.genre{border-radius:10px;background:linear-gradient(160deg,hsl(var(--h) 70% 42%),hsl(calc(var(--h) + 25) 70% 22%))}
.panel,.kpi,.tbl-wrap{border-color:var(--line);background:var(--surface)}
.phead{border-bottom:0}
.phead .art img{border-radius:10px}
.phead h1{font-weight:800;letter-spacing:-.035em}
.phead .meta a{color:var(--accent)}
.player{background:rgba(28,28,30,.78);border-top:1px solid rgba(255,255,255,.08)}
.p-now img{border-radius:6px}
.p-ctl .main{background:none;color:var(--fg);width:44px;height:44px}
.p-ctl .main svg{width:30px;height:30px}
.p-ctl .ic.on{color:var(--accent)}
.np .bigcov{border-radius:12px}
.modal-box{background:#1C1C1E;border:0;border-radius:14px}
.toast{background:rgba(44,44,46,.95);color:var(--fg);backdrop-filter:blur(20px)}

/* ---------- Diaporama d'accueil ---------- */
.hero-slider{position:relative;border-radius:16px;overflow:hidden;background:#000;isolation:isolate}
.hs-track{display:grid}
.hs-slide{grid-area:1/1;position:relative;min-height:420px;display:flex;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s linear .9s}
.hs-slide.on{opacity:1;visibility:visible;transition:opacity .9s ease,visibility 0s}
.hs-bg{position:absolute;inset:-40px;background:var(--bgimg) center 28%/cover no-repeat,#140a03;filter:blur(14px) saturate(1.15);transform:scale(1.05)}
.hs-bg-plain{background:linear-gradient(135deg,#2A1405,#000)}
.hs-slide.on .hs-bg{animation:hsZoom 9s ease-out forwards}
@keyframes hsZoom{from{transform:scale(1.05)}to{transform:scale(1.16)}}
.hs-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.62) 45%,rgba(0,0,0,.25) 100%)}
.hs-content{position:relative;z-index:1;flex:1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end;padding:36px 36px 52px}

.hs-slide.on .hs-text>*:nth-child(2){animation-delay:.08s}.hs-slide.on .hs-text>*:nth-child(3){animation-delay:.16s}.hs-slide.on .hs-text>*:nth-child(4){animation-delay:.24s}
.hs-slide.on .feat,.hs-slide.on .hs-portrait{animation:hsUp .9s .2s cubic-bezier(.2,.7,.2,1) both}
@keyframes hsUp{from{transform:translateY(18px)}to{transform:none}}
.hero-slider .feat{background:rgba(20,20,20,.6);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:0;justify-self:end;max-width:380px;width:100%}
.hs-portrait{justify-self:end;align-self:center;width:min(300px,100%);aspect-ratio:4/5;border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.hs-portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.hs-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-size:26px;line-height:1;display:grid;place-items:center;opacity:0;transition:opacity .2s}
.hero-slider:hover .hs-nav,.hs-nav:focus-visible{opacity:1}.hs-nav:hover{background:rgba(255,255,255,.26)}
.hs-prev{left:12px}.hs-next{right:12px}
.hs-dots{position:absolute;left:36px;bottom:20px;z-index:2;display:flex;gap:6px}
.hs-dots button{width:26px;height:4px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden;padding:0}
.hs-dots button i{display:block;height:100%;width:0;background:#fff}
.hs-dots button.on i{animation:hsBar var(--dur,7s) linear forwards}
.hero-slider.paused .hs-dots button.on i{animation-play-state:paused}
@keyframes hsBar{to{width:100%}}
/* Entrée des sections + logo animé pendant la lecture */
.sec.rv{transform:translateY(22px);transition:transform .7s cubic-bezier(.2,.7,.2,1)}

@keyframes eq{from{transform:scaleY(.45)}to{transform:scaleY(1.05)}}
@media (max-width:860px){

   Mode "local" (visiteur non connecté / runtime absent) : catalogue de démonstration dans le navigateur.
   Toute lecture/écriture passe par les fonctions de la section DONNÉES (remplaçables par Supabase).
   ========================================================= */

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const key=s=>norm(s).replace(/[^a-z0-9]/g,'');

    for(let k=0;k<(al?3:2);k++){n++;const ts=now-(i*3+k)*day;tracks.push({id:'t'+n,title:`Demo track ${k+1} · ${k%2?g2:g1}`,artistId:a.id,featIds:[],albumId:al?al.id:null,genre:k%2?g2:g1,duration:40,status:'published',publishedAt:ts,releaseDate:new Date(ts).toISOString().slice(0,10),demo:true,rights:'demo',createdAt:ts})}});

/* Écritures catalogue (admin) */
function upsert(kind,obj){const arr=DB[kind],i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj)}
async function putDoc(kind,obj){
  if(kind==='tracks')obj=normTrack(obj);
  upsert(kind,obj);
  if(!cloud()){saveLocalCatalog();return}
  const body=clean(obj);delete body.id;
  if(supa()){if(kind==='tracks'){const live=obj.status==='published'||obj.status==='scheduled',to=live?'tracks':'drafts',from=live?'drafts':'tracks';
      await sbx(SB.from('music_docs').upsert({kind:to,id:obj.id,data:body}));await sbx(SB.from('music_docs').delete().eq('kind',from).eq('id',obj.id))}
    else await sbx(SB.from('music_docs').upsert({kind,id:obj.id,data:body}));return}
  if(kind==='tracks'){const live=obj.status==='published'||obj.status==='scheduled',to=live?'tracks':'drafts',from=live?'drafts':'tracks';
    await DBX.collection(to).doc(obj.id).set(body);await DBX.collection(from).doc(obj.id).delete().catch(()=>{});}
  else await DBX.collection(kind).doc(obj.id).set(body);
}
async function delDoc(kind,id){
  DB[kind]=DB[kind].filter(x=>x.id!==id);
  if(!cloud()){saveLocalCatalog();return}
  if(supa()){await sbx(SB.from('music_docs').delete().in('kind',kind==='tracks'?['tracks','drafts']:[kind]).eq('id',id));return}
  if(kind==='tracks'){await DBX.collection('tracks').doc(id).delete().catch(()=>{});await DBX.collection('drafts').doc(id).delete().catch(()=>{})}
  else await DBX.collection(kind).doc(id).delete();
}

let meTimer=null,meWriting=false,meDirty=false;
function saveMe(){
  if(!ME)return;

  meDirty=true;clearTimeout(meTimer);meTimer=setTimeout(flushMe,400);
}
async function flushMe(){
  if(meWriting||!meDirty||!UID)return;meWriting=true;meDirty=false;
  const body=clean({favs:ME.favs,follows:ME.follows,albums:ME.albums,history:ME.history.slice(0,100),playlists:ME.playlists,listens:ME.listens,log:ME.log.slice(-400),updatedAt:Date.now()});
  try{if(supa())await sbx(SB.from('music_people').upsert({user_id:UID,data:body,updated_at:new Date().toISOString()}));else await DBX.doc('people/'+UID).set(body)}catch(e){if(!flushMe.warned){flushMe.warned=1;toast(e&&e.code==='quota_exceeded'?'Storage is full.':"Your favourites and plays can't be saved with your access level.")}}
  meWriting=false;if(meDirty)flushMe();
}

/* Fichiers : stockage serveur (cloud) ou session (local) */
async function uploadFile(b,type){
  if(supa()){const img=/^image\//.test(type),ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','video/mp4':'m4a','video/webm':'webm','audio/mpeg':'mp3','audio/mp4':'m4a','audio/x-m4a':'m4a','audio/aac':'aac','audio/ogg':'ogg','audio/webm':'webm','audio/flac':'flac','audio/wav':'wav'}[type]||'bin';
    const path=(img?'img/':'audio/')+(crypto.randomUUID?crypto.randomUUID():uid('f'))+'.'+ext;
    const r=await SB.storage.from(img?SUPA_IMG:SUPA_AUDIO).upload(path,b,{contentType:type,cacheControl:'31536000',upsert:false});
    if(r.error)throw new Error(/size|large/i.test(r.error.message)?'This file is too large for storage.':/row-level|policy|permission|Unauthorized/i.test(r.error.message)?"Upload refused: your account is not an administrator.":"The upload failed: "+r.error.message);
    return {id:path}}
  if(cloud()){if(!ASSETS)throw new Error("File storage isn't available with your access level (Editor required).");
    try{const r=await ASSETS.upload(b,{type});return {id:r.id}}catch(e){throw new Error({too_large:'File too large (20 MB maximum).',quota_or_state:'Storage is full: delete unused files.',unsupported_type:'This file format was refused by the storage.'}[e&&e.code]||"The upload failed. Please try again.")}}
  return {local:URL.createObjectURL(b)};
}
async function dropFile(id){if(!id)return;if(supa()){try{await SB.storage.from(/^img\//.test(id)?SUPA_IMG:SUPA_AUDIO).remove([id])}catch(e){}return}if(cloud()&&ASSETS){try{await ASSETS.delete(id)}catch(e){}}}

let renderTimer=null,pendingRender=false;
function scheduleRender(){clearTimeout(renderTimer);renderTimer=setTimeout(()=>{const a=document.activeElement;if(a&&$('#view').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){pendingRender=true;return}chrome();rerender();renderPlayer()},120)}
document.addEventListener('focusout',()=>{if(pendingRender){pendingRender=false;setTimeout(scheduleRender,50)}});
async function bootCloud(){
  if(!window.claude||!window.claude.use)return;
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  DBX=db;USERX=user;UID=id;MODE='cloud';
  CAN_EDIT=await user.canEdit().catch(()=>false);
  const meInfo=await user.me().catch(()=>null);MYNAME=(meInfo&&meInfo.name)||'You';
  if(CAN_EDIT){ASSETS=await claude.use('assets').catch(()=>null)}
  Object.assign(DB,{artists:[],albums:[],tracks:[],playlists:[]});
  ME={id:UID,...emptyMe()};PEOPLE=[ME];
  let pubT=[],draftT=[];const mergeT=()=>{DB.tracks=[...pubT,...draftT].map(normTrack)};
  const sub=(path,fn)=>db.collection(path).onSnapshot(s=>{fn(s.docs.map(d=>({...d.data(),id:d.id})));scheduleRender()},e=>console.warn(path,e));
  sub('artists',d=>DB.artists=d.map(a=>({...a})));
  sub('albums',d=>DB.albums=d.map(a=>({...a})));
  sub('playlists',d=>DB.playlists=d.map(p=>({...p,trackIds:p.trackIds||[]})));
  sub('tracks',d=>{pubT=d;mergeT()});
  if(CAN_EDIT){sub('drafts',d=>{draftT=d;mergeT()});
    sub('people',d=>{PEOPLE=d.map(p=>p.id===UID?ME:{...emptyMe(),...p});if(!PEOPLE.includes(ME))PEOPLE.push(ME)})}
  db.doc('meta/genres').onSnapshot(s=>{if(s.exists&&Array.isArray(s.data().list))DB.genres=s.data().list.slice();scheduleRender()},()=>{});
  db.doc('people/'+UID).onSnapshot(s=>{if(s.exists&&!meDirty&&!meWriting){const d=s.data();Object.assign(ME,emptyMe(),JSON.parse(JSON.stringify(d)),{id:UID})}scheduleRender()},()=>{});
  setInterval(()=>{if(DB.tracks.some(t=>t.status==='scheduled'&&t.publishAt<=Date.now()&&t.publishAt>Date.now()-61e3))scheduleRender()},60e3);
  route();
}

let PROFILES={};
async function bootSupa(){

async function supaSession(s){
  UID=s?.user?.id||null;MYEMAIL=s?.user?.email||'';CAN_EDIT=false;ME=null;PEOPLE=[];
  if(UID){const {data:pr}=await SB.from('music_profiles').select('display_name,role').eq('id',UID).maybeSingle();
    MYNAME=pr?.display_name||s.user.user_metadata?.name||MYEMAIL.split('@')[0];CAN_EDIT=pr?.role==='admin';
    const {data:pp}=await SB.from('music_people').select('data').eq('user_id',UID).maybeSingle();
    ME={...emptyMe(),...(pp?.data||{}),id:UID,name:MYNAME,email:MYEMAIL,role:CAN_EDIT?'admin':'user',hue:24};PEOPLE=[ME]}

async function supaLoad(){
  const {data,error}=await SB.from('music_docs').select('kind,id,data').limit(5000);if(error){console.warn(error);return}
  const by=k=>data.filter(r=>r.kind===k).map(r=>({...r.data,id:r.id}));
  DB.artists=by('artists');DB.albums=by('albums');DB.playlists=by('playlists').map(p=>({...p,trackIds:p.trackIds||[]}));
  DB.tracks=[...by('tracks'),...by('drafts')].map(normTrack);const g=data.find(r=>r.kind==='meta'&&r.id==='genres');if(g&&Array.isArray(g.data.list))DB.genres=g.data.list.slice();
  if(CAN_EDIT){const [pp,pr]=await Promise.all([SB.from('music_people').select('user_id,data,updated_at').limit(5000),SB.from('music_profiles').select('id,display_name,role').limit(5000)]);
    PROFILES=Object.fromEntries((pr.data||[]).map(p=>[p.id,p]));
    PEOPLE=(pp.data||[]).map(r=>r.user_id===UID?ME:{...emptyMe(),...r.data,id:r.user_id,updatedAt:r.data?.updatedAt||Date.parse(r.updated_at)});if(ME&&!PEOPLE.includes(ME))PEOPLE.push(ME)}
  scheduleRender();
}

/* ---------- Visuels ---------- */
function rng(seed){let s=2166136261;for(const c of String(seed))s=Math.imul(s^c.charCodeAt(0),16777619)>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
const coverCache={};
function genCover(seed){
  if(coverCache[seed])return coverCache[seed];
  const c=document.createElement('canvas');c.width=c.height=360;const g=c.getContext('2d');const r=rng(seed);const h=(Math.floor(r()*60)+10+(r()<.3?190:0))%360;
  g.fillStyle=`hsl(${h},35%,9%)`;g.fillRect(0,0,360,360);const cell=45;
  for(let y=0;y<8;y++)for(let x=0;x<8;x++){const v=r();if(v<.45)continue;g.fillStyle=`hsla(${(h+(v>.82?180:v>.62?25:0))%360},${60+r()*30}%,${32+r()*30}%,${.55+r()*.45})`;g.beginPath();const X=x*cell,Y=y*cell,k=Math.floor(r()*4);
    if(k===0){g.moveTo(X,Y);g.lineTo(X+cell,Y);g.lineTo(X,Y+cell)}else if(k===1){g.moveTo(X+cell,Y);g.lineTo(X+cell,Y+cell);g.lineTo(X,Y+cell)}else if(k===2){g.arc(X+cell/2,Y+cell/2,cell/2-3,0,Math.PI*2)}else{g.rect(X+6,Y+6,cell-12,cell-12)}g.fill()}
  g.beginPath();g.arc(90+r()*180,90+r()*180,60+r()*50,0,Math.PI*2);g.fillStyle='rgba(255,122,26,.92)';g.fill();
  return coverCache[seed]=c.toDataURL('image/jpeg',.84);
}
const albumCover=a=>a.coverId?blob(a.coverId):a.cover||genCover(a.id);
const trackCover=t=>t.coverId?blob(t.coverId):t.cover||(t.albumId&&api.album(t.albumId)?albumCover(api.album(t.albumId)):genCover(t.id));
const plCover=p=>p.coverId?blob(p.coverId):genCover('pl'+p.id);
const artistPhoto=a=>a.photoUrl||(a.photoId?blob(a.photoId):a.photo)||null;
function avatar(a,size){
  const ini=String(a.name||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(),src=artistPhoto(a);

function recordPlay(t){
  const L=ME||(cloud()?null:ANON);if(!L||!isLive(t))return;
  const now=Date.now(),l=(L.listens=L.listens||{})[t.id]||{n:0,last:0};
  if(now-l.last<30*60e3)return;
  L.log=L.log||[];if(L.log.filter(x=>now-x.ts<864e5).length>=200)return;
  l.n++;l.last=now;L.listens[t.id]=l;L.log.push({t:t.id,ts:now});if(L.log.length>400)L.log=L.log.slice(-400);
  if(api.me()){ME.history=[{t:t.id,ts:now},...(ME.history||[]).filter(h=>h.t!==t.id)].slice(0,100)}
  if(L===ANON)store.set('anon2',ANON);else saveMe();
}

function songsFiltered(){
  const q=norm(SQ.q).trim().split(/\s+/).filter(Boolean),now=Date.now(),y0=new Date(new Date().getFullYear(),0,1).getTime();
  return DB.tracks.filter(t=>{
    if(q.length){const s=norm([t.title,artistText(t),t.producer,t.writers,t.genre,t.albumId?api.album(t.albumId)?.title:''].join(' '));if(!q.every(w=>s.includes(w)))return false}
    if(SQ.artist&&t.artistId!==SQ.artist&&!t.featIds.includes(SQ.artist))return false;
    if(SQ.album==='_single'&&t.albumId)return false;if(SQ.album&&SQ.album!=='_single'&&t.albumId!==SQ.album)return false;
    if(SQ.status&&t.status!==SQ.status)return false;
    if(SQ.date){const d=pubDate(t);if(!d)return false;if(SQ.date==='future')return d>now;if(SQ.date==='year')return d>=y0&&d<=now;return d<=now&&now-d<=(+SQ.date)*864e5}
    return true}).sort((a,b)=>(b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt));
}

</tr>`).join('')}

function acSetup(inputId,listId,onPick,opts={}){
  const inp=$('#'+inputId),ul=$('#'+listId);if(!inp)return;let items=[],hi=-1;
  const close=()=>{ul.hidden=true;inp.setAttribute('aria-expanded','false');hi=-1};
  const draw=()=>{const q=key(inp.value);const ex=opts.exclude?opts.exclude():[];
    items=DB.artists.filter(a=>!ex.includes(a.id)&&(!q||key(a.name).includes(q))).sort((a,b)=>(key(a.name).startsWith(q)?0:1)-(key(b.name).startsWith(q)?0:1)||a.name.localeCompare(b.name)).slice(0,8);
    const exact=DB.artists.some(a=>key(a.name)===q);
    ul.innerHTML=items.map((a,i)=>`<li role="option" data-i="${i}" class="${i===hi?'hi':''}"><span style="width:28px;flex:none">${avatar(a,11)}</span>${esc(a.name)}<small>${esc(a.country||'')}</small></li>`).join('')+(q&&!exact?`<li role="option" data-new="1" class="${hi===items.length?'hi':''}">${I.plus} Create the artist “${esc(inp.value.trim())}”</li>`:'')+(!items.length&&!q?'<li class="none">No artists yet</li>':'');
    ul.hidden=false;inp.setAttribute('aria-expanded','true')};
  const pick=async li=>{if(!li)return;if(li.dataset.new){const name=inp.value.trim();if(name.length<2)return;const a={id:uid('a'),name,country:'',bio:'',youtube:'',wma:true,home:true,hue:Math.floor(Math.random()*40)+10,createdAt:Date.now()};
      try{await putDoc('artists',a)}catch(e){return toast("The artist could not be created.")}toast(`Artist “${name}” created`);onPick(a)}else onPick(items[+li.dataset.i]);close()};
  inp.addEventListener('input',()=>{hi=-1;opts.onType&&opts.onType();draw()});inp.addEventListener('focus',draw);
  inp.addEventListener('keydown',e=>{const n=ul.querySelectorAll('li[role=option]').length;if(e.key==='ArrowDown'){e.preventDefault();hi=Math.min(n-1,hi+1);draw()}else if(e.key==='ArrowUp'){e.preventDefault();hi=Math.max(0,hi-1);draw()}else if(e.key==='Enter'&&!ul.hidden&&hi>=0){e.preventDefault();pick(ul.querySelectorAll('li[role=option]')[hi])}else if(e.key==='Escape'){e.stopPropagation();close()}});
  ul.addEventListener('mousedown',e=>{e.preventDefault();pick(e.target.closest('li[role=option]'))});
  inp.addEventListener('blur',()=>setTimeout(close,120));
}
function bindSongForm(){
  const f=$('#sForm');if(!f||f.dataset.b)return;f.dataset.b=1;

  acSetup('sfFeat','acFeat',a=>{if(!SF.featIds.includes(a.id))SF.featIds.push(a.id);$('#sfFeat').value='';renderFeat();sfPreview()},{exclude:()=>[SF.artistId,...SF.featIds]});
  f.addEventListener('input',sfPreview);f.addEventListener('change',e=>{if(e.target.name==='sfMode')updateSubmit();sfPreview()});
  $('#sfCover').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{SF.img=await readImg(file,1600);const im=$('#sfCovPrev');im.src=SF.img.url;im.hidden=false;
      if(SF.img.w!==SF.img.h)toast('Tip: the cover isn\'t square, so it will be cropped on display.');sfPreview()}catch(x){$('#sfErr').textContent=x.message;e.target.value=''}};
  $('#sfAudio').onchange=async e=>{const file=e.target.files[0];if(!file)return;const st=$('#sfAudioState'),pg=$('#sfProg'),bar=pg.firstElementChild;$('#sfErr').textContent='';SF.audio=null;f.dataset.busy='1';$('#sfSubmit').disabled=true;pg.hidden=false;
    try{const r=await prepareAudio(file,(msg,p)=>{st.textContent=`${file.name} · ${msg}`;bar.style.width=Math.round(p*100)+'%'});
      SF.audio=r;r.url=URL.createObjectURL(r.blob);const a=$('#sfPrevAudio');a.src=r.url;a.hidden=false;$('#sfDur').value=fmt(r.duration);
      if(!$('#sfTitle').value.trim())$('#sfTitle').value=file.name.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ').trim();
      st.innerHTML=`<b style="color:var(--good)">Ready</b> · ${esc(file.name)} · ${fmt(r.duration)} · ${(r.blob.size/1048576).toFixed(1)} MB ${r.converted?`· converted to ${r.codec} ${r.kbps} kbps`:'· original format kept'} · listen to the preview below`;sfPreview()}
    catch(x){st.textContent='';$('#sfErr').textContent=x.message;e.target.value=''}
    finally{pg.hidden=true;bar.style.width='0';delete f.dataset.busy;$('#sfSubmit').disabled=false}};
  f.onsubmit=async e=>{e.preventDefault();if(f.dataset.busy)return;const err=$('#sfErr');err.textContent='';const t=SF.orig,m=sfMode();
    const title=$('#sfTitle').value.trim(),release=$('#sfRelease').value,rights=$('#sfRights').checked;
    if(!title)return err.textContent='Enter the song title.';
    if(!SF.artistId||!api.artist(SF.artistId))return err.textContent="Select the main artist from the list (or create them).";
    if(!release)return err.textContent='Enter the release date.';
    if(!SF.audio&&!(t&&(t.audioId||t.audioUrl||t.demo)))return err.textContent='Upload the song\'s audio file.';
    let publishAt=null;
    if(m==='scheduled'){const v=$('#sfWhen').value;if(!v)return err.textContent='Choose the release date and time.';publishAt=new Date(v).getTime();if(publishAt<=Date.now()+60e3)return err.textContent='The scheduled release must be in the future.'}
    if(m!=='draft'&&!rights&&!(t&&t.rights==='demo'))return err.textContent='To publish or schedule, confirm that WMA holds the streaming rights.';
    f.dataset.busy='1';const btn=$('#sfSubmit');btn.disabled=true;const st=$('#sfAudioState');
    try{
      let audioPatch={},coverPatch={};
      if(SF.audio){btn.textContent='Uploading the audio…';const r=await uploadFile(SF.audio.blob,SF.audio.type);audioPatch=r.id?{audioId:r.id,audioUrl:undefined}:{audioUrl:r.local,audioId:null};audioPatch.duration=SF.audio.duration;audioPatch.demo=false;audioPatch.audioType=SF.audio.type}
      if(SF.img){btn.textContent='Uploading the cover…';const r=await storeImage(SF.img);coverPatch=r.coverId?{coverId:r.coverId,cover:null}:{cover:r.cover,coverId:null}}
      btn.textContent='Saving…';
      const now=Date.now(),albumId=$('#sfAlbum').value||null;
      const tr={...(t||{}),id:t?.id||uid('t'),title,artistId:SF.artistId,featIds:SF.featIds.slice(),albumId,genre:$('#sfGenre').value,releaseDate:release,
        producer:$('#sfProd').value.trim(),writers:$('#sfWriters').value.trim(),description:$('#sfDesc').value.trim(),rightsNote:$('#sfRightsNote').value.trim(),
        rights:rights?'confirmed':(t?.rights==='demo'?'demo':'pending'),status:m,publishAt:m==='scheduled'?publishAt:null,
        publishedAt:m==='published'?(t&&t.status==='published'&&t.publishedAt?t.publishedAt:now):(m==='scheduled'?publishAt:null),
        trackNo:t?.trackNo||(albumId?DB.tracks.filter(x=>x.albumId===albumId).length+1:null),createdAt:t?.createdAt||now,updatedAt:now,...audioPatch,...coverPatch};
      if(tr.audioUrl===undefined)delete tr.audioUrl;
      await putDoc('tracks',tr);

      if(t&&SF.img&&t.coverId&&t.coverId!==tr.coverId)dropFile(t.coverId);

      if(location.hash!=='#admin-songs')location.hash='#admin-songs';else rerender();
    }catch(x){err.textContent=(x&&x.message)||"Saving failed. Check your connection and try again.";btn.disabled=false;updateSubmit();delete f.dataset.busy}
  };
}

  const topT=DB.tracks.map(t=>[t,stat.plays(t.id)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,8),topA=DB.artists.map(a=>[a,stat.artistPlays(a.id)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const bars=(rows,lab)=>rows.length?`<div class="bars">${rows.map(([o,n])=>`<div class="bar"><div style="min-width:0"><div class="t1" style="font-size:13px">${esc(lab(o))}</div><i style="width:${n/rows[0][1]*100}%"></i></div><span class="mono" style="text-align:right">${n}</span></div>`).join('')}</div>`:'<div class="empty">No plays counted yet.</div>';
  return `${kpiBlock()}<p class="note" style="margin-top:14px">Counting rules: a play counts after 30 seconds actually played (75% for a short song), with sound on and at normal speed; at most one play per listener per song every 30 minutes; a cap of 200 plays per listener per 24 hours. No data is added or estimated.</p>
   <div class="panel" style="margin-top:18px"><h3 style="font-size:17px;margin-bottom:12px">Plays · last 14 days</h3>${playsChart()}</div>
   <div class="two" style="margin-top:16px"><div class="panel"><h3 style="font-size:17px;margin-bottom:14px">Most played songs</h3>${bars(topT,t=>t.title+' — '+artistText(t))}</div><div class="panel"><h3 style="font-size:17px;margin-bottom:14px">Most popular artists</h3>${bars(topA,a=>a.name)}</div></div>`;
};
function playsChart(){
  const log=stat.log(),days=[],d0=new Date();d0.setHours(0,0,0,0);
  for(let i=13;i>=0;i--){const s=d0.getTime()-i*864e5;days.push({s,n:log.filter(p=>p.ts>=s&&p.ts<s+864e5).length})}
  const max=Math.max(...days.map(d=>d.n));if(!max)return '<div class="empty">The chart will appear after the first counted plays.</div>';
  const top=Math.max(4,Math.ceil(max/4)*4),W=720,H=220,L=36,R=12,T=12,B=28,x=i=>L+i*(W-L-R)/13,y=v=>T+(H-T-B)*(1-v/top),pts=days.map((d,i)=>`${x(i)},${y(d.n)}`).join(' ');
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:480px" role="img" aria-label="Plays per day">
   ${[0,.25,.5,.75,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${y(top*f)}" y2="${y(top*f)}" stroke="#2C2C2E"/><text x="${L-8}" y="${y(top*f)+4}" fill="#8E8E93" font-size="11" text-anchor="end" font-family="ui-monospace,monospace">${top*f}</text>`).join('')}
   <polygon points="${x(0)},${y(0)} ${pts} ${x(13)},${y(0)}" fill="rgba(255,122,26,.20)"/><polyline points="${pts}" fill="none" stroke="#FF7A1A" stroke-width="2.5" stroke-linejoin="round"/>
   ${days.map((d,i)=>`${i%2===1||i===13?`<text x="${x(i)}" y="${H-8}" fill="#8E8E93" font-size="11" text-anchor="middle" font-family="ui-monospace,monospace">${new Date(d.s).toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit'})}</text>`:''}${d.n?`<circle cx="${x(i)}" cy="${y(d.n)}" r="${i===13?5:3}" fill="#FF7A1A"><title>${d.n} play(s)</title></circle>`:''}`).join('')}</svg></div>`;
}

function parsePhotoList(txt){
  txt=txt.trim();if(!txt)return [];
  if(/^[\[{]/.test(txt)){let d=JSON.parse(txt);if(!Array.isArray(d))d=d.artists||d.data||Object.entries(d).map(([name,url])=>({name,url}));
    return d.map(o=>({id:o.id??o.slug??null,name:o.name??o.nom??o.artist_name??o.full_name??'',url:o.photo_url??o.photoUrl??o.avatar_url??o.image_url??o.image??o.photo??o.url??''}))}
  return txt.split(/\r?\n/).filter(l=>l.trim()&&!/^\s*(nom|name)\s*[,;]/i.test(l)).map(l=>{const p=l.split(/[;,\t]/);return {id:null,name:(p[0]||'').trim(),url:(p.slice(1).join(',')||'').trim()}});
}

});
$('#topSearch').addEventListener('input',e=>{searchState.q=e.target.value;if(!location.hash.startsWith('#search'))location.hash='#search';else{const r=$('#sResults');if(r)r.innerHTML=searchResults();const ps=$('#pageSearch');if(ps)ps.value=e.target.value}});
function openModal(h,wide){const m=$('#modal');m.innerHTML=`<div class="modal-box${wide?' wide':''}" role="dialog" aria-modal="true">${h}</div>`;m.hidden=false;const f=m.querySelector('input:not([type=file]),select,button');f&&f.focus()}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!$('#modal').querySelector('[data-busy]'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').querySelector('[data-busy]'))closeModal();if(e.code==='Space'&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();toggle()}});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3000)}
function confirmModal(text,label,fn){openModal(`<h3>Confirm</h3><p class="muted">${text}</p><div class="actions"><button class="btn pri" id="cfOk" style="background:var(--bad);color:#fff">${label}</button><button class="btn" data-act="close">Cancel</button></div>`);$('#cfOk').onclick=async()=>{$('#cfOk').disabled=true;try{await fn()}catch(e){toast(e.message||'This action could not be completed.')}closeModal()}}

/* =========================================================
   NAVIGATION
   ========================================================= */
function chrome(){
  const h=location.hash.slice(1)||'home',m=api.me(),is=k=>h===k||h.startsWith(k+'-'),adm=api.isAdmin();
  $('#sideNav').innerHTML=`<a href="#home" class="${is('home')?'on':''}">${I.home} Home</a><a href="#search" class="${is('search')?'on':''}">${I.search} Search</a><a href="#artists" class="${is('artists')||is('artist')?'on':''}">${I.star} Artists</a><a href="#library" class="${is('library')||is('favorites')?'on':''}">${I.lib} Library</a><a href="#profile" class="${is('profile')?'on':''}">${I.user} Profile</a>
   ${adm?`<div style="height:14px"></div><div class="nav-label">WMA ADMIN</div><a href="#admin-songs" class="${h==='admin-songs'?'on':''}">${I.star} Music manager</a><a href="#admin" class="${is('admin')&&h!=='admin-songs'?'on':''}">${I.admin} Administration</a><button class="btn pri" style="margin:8px 10px 0;width:calc(100% - 20px)" data-act="aTrack">${I.upload} ADD A SONG</button>`:''}
   ${m?`<div style="height:14px"></div><div class="nav-label">Your playlists</div>${(m.playlists||[]).slice(0,8).map(p=>`<a href="#playlist-${p.id}" class="${h==='playlist-'+p.id?'on':''}" style="font-weight:500">${esc(p.name)}</a>`).join('')||'<span class="muted" style="font-size:12.5px;padding:0 10px">None yet</span>'}`:''}`;
  $('#tabs').innerHTML=`<a href="#home" class="${is('home')?'on':''}">${I.home}Home</a><a href="#search" class="${is('search')?'on':''}">${I.search}Search</a><a href="#library" class="${is('library')||is('favorites')?'on':''}">${I.lib}Library</a><a href="#profile" class="${is('profile')||is('admin')?'on':''}">${adm?I.admin:I.user}${adm?'Admin':'Profile'}</a>`;
  $('#topActions').innerHTML=art()?(adm?`<button class="btn pri sm" data-act="aTrack">${I.plus} Song</button>`:'')+`<a class="me" href="#profile"><span style="width:32px">${avatar({name:MYNAME,hue:24},13)}</span><span class="t1" style="max-width:140px">${esc(MYNAME)}</span></a>`
    :m?(adm?`<button class="btn pri sm" data-act="aTrack">${I.plus} Song</button>`:'')+`<a class="me" href="#profile"><span style="width:32px">${avatar({name:m.name,hue:m.hue},13)}</span><span class="t1" style="max-width:140px">${esc(m.name)}</span></a>`:`<a class="btn ghost" href="#signup">Sign up</a><a class="btn pri" href="#login">Sign in</a>`;
}
function rerender(){
  const h=location.hash.slice(1)||'home',i=h.indexOf('-'),name=i>0?h.slice(0,i):h,arg=i>0?h.slice(i+1):undefined,fn=pages[name]||notFound;
  $('#view').innerHTML=fn(arg);bindForms();bindHero();bindReveal();refreshPlaying();if(name==='now')renderNowControls();
}
function route(){if(!$('#modal').querySelector('[data-busy]'))closeModal();chrome();rerender();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
bootLocal();route();renderPlayer();
bootSupa().then(ok=>{if(!ok)return bootCloud()}).catch(e=>console.warn('backend',e));

</script>
