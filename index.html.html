/* ---------- Trending ---------- */
function trendList(f){const pub=api.pub();
  if(f==='hot')return pub.slice().sort((a,b)=>stat.recent(b.id)-stat.recent(a.id)||byPlays(a,b)).slice(0,24);
  if(f==='new')return sortNew(pub).slice(0,24);
  return pub.filter(t=>t.genre===f).sort(byPlays).slice(0,24)}
function trendGenres(){const c={};api.pub().forEach(t=>{if(t.genre)c[t.genre]=(c[t.genre]||0)+1});return Object.keys(c).sort((a,b)=>c[b]-c[a]||a.localeCompare(b)).slice(0,8)}
function trendRows(f){const l=trendList(f),q=l.map(t=>t.id).join(','),cur=curTrack();if(!l.length)return '<div class="empty">No songs here yet.</div>';
  return `<div class="tgrid">${l.map(t=>`<div class="trow2 ${cur&&cur.id===t.id?'cur':''}" data-id="${t.id}"><button class="tr-cov" data-act="play" data-id="${t.id}" data-q="${q}" aria-label="Play ${esc(t.title)}"><img src="${trackCover(t)}" alt="" loading="lazy"></button>
   <div class="tr-txt"><a class="t1" href="#track-${t.id}">${esc(t.title)}</a><div class="t2">${artistLinks(t)}</div></div>
   <button class="ic" data-act="addpl" data-id="${t.id}" aria-label="Add ${esc(t.title)} to a playlist" title="Add to a playlist">${I.plus}</button></div>`).join('')}</div>`}
function fanArtist(){const m=api.me(),ok=a=>a&&api.tracksOf(a.id).some(isLive);
  if(m){for(const id of (m.follows||[]).slice().reverse()){const a=api.artist(id);if(ok(a))return a}
    const c={};Object.entries(m.listens||{}).forEach(([tid,v])=>{const t=api.track(tid);if(t)c[t.artistId]=(c[t.artistId]||0)+(+(v&&v.n)||0)});
    const top=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];if(top&&ok(api.artist(top)))return api.artist(top)}
  const n=sortNew(api.pub())[0];return n?api.artist(n.artistId):null}
function bannerSlides(){const seen=new Set(),out=[];for(const t of sortNew(api.pub())){const a=api.artist(t.artistId);if(!a||seen.has(a.id))continue;seen.add(a.id);out.push(t);if(out.length>=8)break}return out}
function trendingView(){
  const slides=[];HERO_N=1;if(HERO_I>=HERO_N)HERO_I=0;const qs=slides.map(t=>t.id).join(',');
  const banner=slides.length?`<section class="hero-slider bn" aria-roledescription="carousel" aria-label="New releases" style="--i:${HERO_I}"><div class="hs-track">${slides.map((t,n)=>{const a=api.artist(t.artistId),img=(a&&(artistPhoto(a)||artistCoverSrc(a)))||trackCover(t);
      return `<div class="hs-slide bn-slide" data-i="${n}"><div class="bn-photo" style="--bgimg:url('${esc(img)}')"></div><div class="bn-line"></div>
       <div class="bn-left"><div class="bn-title">${esc(t.title)}</div><div class="bn-artist">${esc(artistText(t))}</div><img class="bn-cov" src="${trackCover(t)}" alt=""></div>
       <a class="bn-link" href="#track-${t.id}" aria-label="${esc(t.title)} by ${esc(artistText(t))}"></a>
       <button class="bn-play" data-act="play" data-id="${t.id}" data-q="${qs}" aria-label="Play ${esc(t.title)}">${I.play}</button></div>`}).join('')}</div>
     ${slides.length>1?`<button class="hs-nav hs-prev" data-act="heroGo" data-d="-1" aria-label="Previous slide">‹</button><button class="hs-nav hs-next" data-act="heroGo" data-d="1" aria-label="Next slide">›</button>
     <div class="hs-dots">${slides.map((_,n)=>`<button data-act="heroTo" data-n="${n}" aria-label="Slide ${n+1}" class="${n===HERO_I?'on':''}"><i></i></button>`).join('')}</div>`:''}</section>`:'';
  const fa=fanArtist(),rel=fa&&sortNew(api.tracksOf(fa.id).filter(isLive))[0],fq=fa?sortNew(api.tracksOf(fa.id).filter(isLive)).map(t=>t.id).join(','):'';
  const fans=rel?`<section class="sec fans"><div class="fans-h"><a href="#artist-${fa.id}" class="fans-av" aria-label="${esc(fa.name)}">${avatar(fa,16)}</a><div style="min-width:0"><div class="t2">The latest releases for fans of</div><div class="fans-n">${vName(fa)}</div></div><a class="more" href="#artist-${fa.id}">MORE</a></div>
    <div class="relcard"><a href="#track-${rel.id}" class="relcov"><img src="${trackCover(rel)}" alt=""></a><div class="reltxt"><a class="t1" href="#track-${rel.id}">${esc(rel.title)}</a><div><div class="t2">${artistLinks(rel)}</div><div class="t2 kind">${esc(kindLabel(rel))}</div></div></div>
    <button class="relplay" data-act="play" data-id="${rel.id}" data-q="${fq}" aria-label="Play ${esc(rel.title)}">${I.play}</button></div></section>`:'';
  const chips=[['hot','Hot'],['new','New'],...trendGenres().map(g=>[g,g])];if(!chips.some(c=>c[0]===TREND_F))TREND_F='hot';
  const trend=`<section class="sec"><div class="sec-h2"><h2>Trending Songs</h2><a class="more" href="#trending">MORE</a></div>
    <div class="tchips" role="tablist" aria-label="Trending filter">${chips.map(([k,l])=>`<button class="tchip ${TREND_F===k?'on':''}" role="tab" aria-selected="${TREND_F===k}" data-act="trendF" data-f="${esc(k)}">${esc(l)}</button>`).join('')}</div>
    <div id="trendRows">${trendRows(TREND_F)}</div></section>`;
  const pop=DB.artists.filter(a=>api.tracksOf(a.id).length).sort((a,b)=>stat.artistPlays(b.id)-stat.artistPlays(a.id)||stat.followers(b.id)-stat.followers(a.id)||a.name.localeCompare(b.name)).slice(0,12);
  const up=api.upcoming(),vids=api.videos();
  return discoverView()+fans+trend
   +(up.length?sec('Coming soon',`<div class="up-grid">${up.slice(0,4).map(upcomingCard).join('')}</div>`,['#upcoming','See all']):'')
   +sec('Charts &amp; picks',rail(api.smartPlaylists().filter(p=>!p.personal).map(plCard)),['#playlists','All playlists'])
   +(vids.length?sec('Music videos',rail(vids.slice(0,10).map(videoCard)),['#videos','All videos']):'')
   +(pop.length?sec('Popular artists',rail(pop.map(artistCard)),['#artists','All artists']):'')}

let DISC_F='all';
function discoverCards(){const pub=api.pub().filter(t=>DISC_F==='all'||t.genre===DISC_F),m=api.me(),fol=m?(m.follows||[]):[];
  const cards=[
    {k:'new',title:'Find something new',link:'#playlist-smart-new',list:sortNew(pub)},
    {k:'hot',title:'Hot right now',link:'#playlist-smart-top',list:pub.slice().sort((a,b)=>stat.recent(b.id)-stat.recent(a.id)||byPlays(a,b))},
    {k:'fol',title:'From artists you follow',link:'#library-artists',list:fol.length?sortNew(pub.filter(t=>fol.includes(t.artistId)||t.featIds.some(f=>fol.includes(f)))):[]},
    {k:'gem',title:'Hidden gems',link:'#search',list:pub.slice().sort((a,b)=>stat.plays(a.id)-stat.plays(b.id)||(pubDate(b)||b.createdAt)-(pubDate(a)||a.createdAt))}];
  const used=new Set();
  return cards.map(c=>{const l=c.list.filter(t=>c.k==='new'||c.k==='fol'||!used.has(t.id)).slice(0,4);l.forEach(t=>used.add(t.id));return {...c,l}}).filter(c=>c.l.length)}
function discoverCardsHTML(){const cards=discoverCards();if(!cards.length)return '<div class="empty">No songs in this genre yet.</div>';
  return `<div class="dcards">${cards.map(c=>{const q=c.l.map(t=>t.id).join(',');return `<section class="dcard" aria-label="${esc(c.title)}"><a class="dcard-h" href="${c.link}"><h2>${esc(c.title)}</h2><span aria-hidden="true">›</span></a>
    ${c.l.map(t=>`<div class="drow" data-id="${t.id}"><button class="dr-cov" data-act="play" data-id="${t.id}" data-q="${q}" aria-label="Play ${esc(t.title)}"><img src="${trackCover(t)}" alt="" loading="lazy"></button>
     <div class="dr-txt"><div class="t1">${esc(artistText(t))}</div><a class="t2" href="#track-${t.id}">${esc(t.title)}</a></div>
     <button class="ic dr-more" data-act="trMenu" data-id="${t.id}" data-q="${q}" aria-label="More options for ${esc(t.title)}">${DI.dots}</button></div>`).join('')}</section>`}).join('')}</div>`}
function discoverView(){const gs=trendGenres();if(DISC_F!=='all'&&!gs.includes(DISC_F))DISC_F='all';
  return `<section class="sec disc"><div class="tchips dchips" role="tablist" aria-label="Genres">${[['all','All'],...gs.map(g=>[g,g])].map(([k,l])=>`<button class="tchip ${DISC_F===k?'on':''}" role="tab" aria-selected="${DISC_F===k}" data-act="discF" data-f="${esc(k)}">${esc(l)}</button>`).join('')}</div>
   <div id="discCards">${discoverCardsHTML()}</div></section>`}

     <div id="cvArtistBox" ${mode==='artist'?'':'hidden'}><label for="cvArt">Artist</label><select id="cvArt">${arts.length?arts.map(a=>`<option value="${a.id}" ${a.id===artSel?'selected':''}>${esc(a.name)}</option>`).join(''):'<option value="">No artist has a photo yet</option>'}</select>

     <p class="muted" id="cvHint" style="font-size:12.5px;margin:6px 0 0">${mode==='auto'?'A cover is generated automatically.':''}</p></div></div></fieldset>`);
  let cvBlob=null,cvTimer=0,cvKey='';
  const curMode=()=>(document.querySelector('input[name=cvMode]:checked')||{}).value||'auto';
  async function refresh(){const m=curMode(),hint=$('#cvHint'),prev=$('#cvPrev');$('#cvArtistBox').hidden=m!=='artist';$('#cvUpBox').hidden=m!=='upload';hint.textContent='';
    if(m==='auto'){cvBlob=null;prev.src=p?_plCoverV4({...p,coverId:null,cover:null}):genCover('plnew');hint.textContent='A cover is generated automatically.';return}
    if(m==='upload'){const f=$('#cvFile').files[0];if(f){try{const r=await readImg(f,1600);cvBlob=r.blob;prev.src=r.url}catch(e){hint.textContent=e.message}}else if(p&&p.coverMode==='upload')prev.src=plCover(p);return}

  document.querySelectorAll('input[name=cvMode]').forEach(r=>r.onchange=refresh);$('#cvArt').onchange=refresh;$('#cvTitle').onchange=refresh;$('#cvFile').onchange=refresh;

  if(mode==='artist'&&!p?.coverId&&!p?.cover)refresh();
  const f=$('#aForm');f.onsubmit=async e=>{e.preventDefault();const name=$('#fName').value.trim();if(!name)return $('#fErr').textContent='Enter a name.';
    const btn=f.querySelector('[type=submit]');btn.disabled=true;const m=curMode();
    let cover={coverMode:m};
    try{
      if(m==='auto')cover={...cover,coverId:null,cover:null,coverArtist:null};
      else if(m==='upload'){const fl=$('#cvFile').files[0];if(fl){btn.textContent='Uploading the cover…';const r=await storeImage(await readImg(fl,1600));cover={...cover,...(r.coverId?{coverId:r.coverId,cover:null}:{cover:r.cover,coverId:null}),coverArtist:null}}
        else if(!(p&&(p.coverId||p.cover)&&p.coverMode!=='artist'))throw new Error('Choose an image for the cover.')}

          if(cvBlob){btn.textContent='Uploading the cover…';const r=await storeImage({blob:cvBlob});cover={...cover,...(r.coverId?{coverId:r.coverId,cover:null}:{cover:r.cover,coverId:null})}}
          else cover={...cover,coverId:null,cover:artistPhoto(a)}}
        cover={...cover,coverArtist:a.id,coverTitle:title}}
      const data={...(p||{id:uid('pl'),createdAt:Date.now()}),name,desc:$('#fDesc').value.trim(),category:$('#fCat').value.trim(),trackIds:[...document.querySelectorAll('input[name=plt]:checked')].map(i=>i.value),...cover};
      await putDoc('playlists',data);closeModal();toast('Playlist saved');rerender()}
    catch(x){btn.disabled=false;btn.textContent='Save';$('#fErr').textContent=x.message&&!/^(canvas|photo)$/.test(x.message)?x.message:'This could not be saved.'}}};

/* ---------- Mes soumissions ---------- */
async function loadMySubs(force){if(!supa()||!api.me()||!UID)return;if(MYSUBS.loading||(!force&&(MYSUBS.list||MYSUBS.tried)))return;MYSUBS.loading=true;MYSUBS.tried=true;const before=JSON.stringify([MYSUBS.list,MYSUBS.err]);
  try{const r=await SB.from('music_submissions').select('*').eq('user_id',UID).order('created_at',{ascending:false});if(r.error)throw r.error;MYSUBS={list:(r.data||[]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)),loading:false,err:null,tried:true};checkSubNotifs(MYSUBS.list)}
  catch(e){MYSUBS={list:MYSUBS.list,loading:false,err:subSetupErr(e),tried:true}}
  /* on ne redessine que si quelque chose a changé (évite le clignotement) */
  if(location.hash==='#submit'&&JSON.stringify([MYSUBS.list,MYSUBS.err])!==before&&!document.activeElement?.closest?.('#subForm'))rerender()}
/* Notifications : comparées au dernier statut vu par l'artiste */
function checkSubNotifs(list){const m=api.me();if(!m)return;m.subSeen=m.subSeen||{};let ch=false;
  list.forEach(s=>{const seen=m.subSeen[s.id];if(seen===s.status+'|'+s.updated_at)return;
    if(seen!==undefined&&seen.split('|')[0]!==s.status){const T=`“${s.title}”`,note=s.team_note?` Message from WMA: ${s.team_note}`:'';
      const txt={pending:`${T} was received by WMA.`,review:`${T} is now being reviewed by the WMA team.`,accepted:`Great news! WMA selected ${T}.${note}`,rejected:`${T} was not selected this time.${note}`,changes:`WMA needs more information about ${T}.${note}`}[s.status];
      if(txt)notify({key:'sub-'+s.id+'-'+s.status+'-'+s.updated_at,text:txt,href:'#submit'})}
    m.subSeen[s.id]=s.status+'|'+s.updated_at;ch=true});if(ch)saveMe()}
const _odlSub=onDataLoaded;onDataLoaded=function(){_odlSub();if(supa()&&api.me())loadMySubs(true)};
setInterval(()=>{if(supa()&&api.me()&&document.visibilityState==='visible')loadMySubs(true)},120000);

function subStatus(s){const st=SUB_ST[s]||SUB_ST.pending;return `<span class="subst ${st.c}">${st.l}</span>`}
function subSteps(s){const order=['pending','review',s==='rejected'?'rejected':'accepted'],cur=s==='changes'?1:order.indexOf(s);
  return `<ol class="substeps" aria-label="Progress">${order.map((k,i)=>`<li class="${i<cur?'done':i===cur?'cur':''}${k==='rejected'?' no':''}"><i></i><span>${SUB_ST[k].l}</span></li>`).join('')}</ol>`}
function mySubCard(s){return `<article class="subcard">${s.cover_path?`<img class="subcov" alt="" data-subsrc="${esc(s.cover_path)}">`:'<div class="subcov"></div>'}
  <div class="subbody"><div class="subhead"><div style="min-width:0"><div class="t1">${esc(s.title)}</div><div class="t2">${esc(s.artists)} · sent ${subDate(s.created_at)}</div></div>${subStatus(s.status)}</div>
   ${subSteps(s.status)}
   ${s.team_note&&['changes','rejected','accepted','review'].includes(s.status)?`<div class="subnote"><b>Message from WMA</b><p>${esc(s.team_note)}</p></div>`:''}
   <div class="actions" style="margin-top:6px">${s.status==='changes'?`<button class="btn pri" data-act="subEdit" data-id="${s.id}">Update my submission</button>`:''}${['pending','changes'].includes(s.status)?`<button class="btn" data-act="subWithdraw" data-id="${s.id}">Withdraw</button>`:''}</div></div></article>`}

  return `<form class="form subform" id="subForm" novalidate>
   ${s?`<div class="subnote"><b>Updating “${esc(s.title)}”</b><p>${esc(s.team_note||'WMA asked for changes.')}</p></div>`:''}
   <div class="subdrop"><label for="sbAudio">${SI.up}<span><b>${s?'Replace the audio file (optional)':'Your song'}</b><small>MP3 or WAV · 50 MB maximum</small></span></label>
    <input id="sbAudio" type="file" accept=".mp3,.wav,audio/mpeg,audio/wav,audio/x-wav" ${s?'':'required'}><div class="t2" id="sbAudioInfo">${s?esc(s.audio_name)+' · '+fmtSize(s.audio_size):''}</div></div>
   <div class="grid2">

    <div class="fld"><label for="sbGenre">Genre *</label><select id="sbGenre" required><option value="">Choose…</option>${g.map(x=>`<option ${s?.genre===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
    <div class="fld"><label for="sbCountry">Country of origin *</label><input id="sbCountry" list="sbCountries" maxlength="60" required value="${esc(s?.country||'')}"><datalist id="sbCountries">${SUB_COUNTRIES.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
   </div>
   <div class="fld"><label for="sbCover">Cover artwork ${s?'(optional — replace)':'*'}</label><div class="subcovin"><img id="sbCoverPrev" alt="" ${s?.cover_path?`data-subsrc="${esc(s.cover_path)}"`:'hidden'}><input id="sbCover" type="file" accept="image/jpeg,image/png,image/webp" ${s?'':'required'}><small class="t2">JPG, PNG or WebP · square, 8 MB maximum</small></div></div>
   <div class="fld"><label for="sbDesc">About the project</label><textarea id="sbDesc" maxlength="1500" placeholder="Tell us about the song, the story, the team…">${esc(s?.description||'')}</textarea></div>
   <fieldset class="subfs"><legend>Artist links</legend><div class="grid2">${SUB_LINKS.map(([k,l])=>`<div class="fld"><label for="sbL_${k}">${l}</label><input id="sbL_${k}" type="url" inputmode="url" placeholder="https://" maxlength="300" value="${esc(L[k]||'')}"></div>`).join('')}</div></fieldset>
   <fieldset class="subfs"><legend>Contact (only visible to the WMA team)</legend><div class="grid2">
    <div class="fld"><label for="sbEmail">Email *</label><input id="sbEmail" type="email" autocomplete="email" maxlength="160" required value="${esc(s?.email||m?.email||'')}"></div>
    <div class="fld"><label for="sbPhone">Phone number *</label><input id="sbPhone" type="tel" autocomplete="tel" maxlength="40" required placeholder="+243 …" value="${esc(s?.phone||'')}"></div></div></fieldset>
   <input class="hp" id="sbWebsite" tabindex="-1" autocomplete="off" aria-hidden="true">
   <label class="check subrights"><input type="checkbox" id="sbRights" ${s?'checked':''}> <span>I confirm that I own the rights to this song, or that I am authorised by the rights holders to submit it to WMA. I understand that submitting does not mean it will be published.</span></label>
   <div class="err" id="sbErr" role="alert">${esc(SUBSTATE.err)}</div>
   <div class="actions"><button class="btn pri subsend" type="button" data-act="subSend" ${SUBSTATE.busy?'disabled':''}>${SUBSTATE.busy?'SENDING…':s?'SEND MY UPDATE':'SEND MY SUBMISSION'}</button>${s&&!SUBSTATE.busy?'<button class="btn" type="button" data-act="subCancelEdit">Cancel</button>':''}</div>
   <div class="subprog" id="sbProg" ${SUBSTATE.busy?'':'hidden'}><i></i><span>${esc(SUBSTATE.msg||'Uploading…')}</span><b class="mono" id="sbPct">${SUBSTATE.pct>=0?SUBSTATE.pct+'%':''}</b></div>
   <div class="subbar" ${SUBSTATE.busy&&SUBSTATE.pct>=0?'':'hidden'}><i id="sbBar" style="width:${Math.max(0,SUBSTATE.pct)}%"></i></div></form>`}

pages.submit=()=>{
  const intro=`<section class="subhero"><div class="eyebrow">For artists, producers &amp; creators</div><h1>Submit your music</h1><p>Send us your song. The WMA team listens to every submission and gets back to you here.</p>
   <ol class="subhow"><li><b>1</b><span>Upload your song and its details</span></li><li><b>2</b><span>The WMA team listens to it</span></li><li><b>3</b><span>Follow the decision here and in your notifications</span></li></ol></section>`;
  if(!supa())return intro+'<div class="empty">Submissions are available on the online version of WMA MUSIC (wmamusic.net).</div>';
  if(!api.me())return intro+`<div class="panel" style="text-align:center"><p style="margin:0 0 14px">Sign in or create a free account to submit your music and follow its review.</p><div class="actions" style="justify-content:center"><a class="btn pri" href="#login">Sign in</a><a class="btn" href="#signup">Create an account</a></div></div>`;
  if(MYSUBS.list===null&&!MYSUBS.loading&&!MYSUBS.tried)setTimeout(()=>loadMySubs(),0);
  const edit=SUBEDIT&&(MYSUBS.list||[]).find(x=>x.id===SUBEDIT&&x.status==='changes');if(SUBEDIT&&!edit)SUBEDIT=null;
  const list=MYSUBS.list;setTimeout(()=>{restoreSubDraft();hydrateSubMedia()},0);
  return intro+`<div class="subgrid"><section class="panel subpanel" aria-labelledby="sfTitle"><h2 id="sfTitle">${edit?'Update your submission':'New submission'}</h2>${subForm(edit)}</section>
   <section class="subside${list&&list.length?' has':''}" aria-labelledby="msTitle"><h2 id="msTitle">My submissions</h2>${MYSUBS.err?`<div class="err">${esc(MYSUBS.err)}</div>`:''}
    ${list===null?(MYSUBS.err?'':'<div class="empty">Loading…</div>'):list.length?list.map(mySubCard).join(''):'<div class="empty">You haven\'t submitted any music yet.</div>'}</section></div>`};


/* Brouillon : si la page est redessinée pendant la saisie, rien n'est perdu (textes et fichiers) */
let SUBDRAFT={},SUBFILES={},SUBSTATE={busy:false,msg:'',err:'',pct:-1};
document.addEventListener('input',e=>{const el=e.target;if(!el.closest||!el.closest('#subForm')||!el.id||el.type==='file')return;if(SUBSTATE.err){SUBSTATE.err='';const er=$('#sbErr');if(er)er.textContent=''}SUBDRAFT[el.id]=el.type==='checkbox'?el.checked:el.value},true);
document.addEventListener('change',e=>{const el=e.target;if(!el.closest||!el.closest('#subForm')||!el.id)return;if(el.type==='file'){if(el.files[0])SUBFILES[el.id]=el.files[0]}else SUBDRAFT[el.id]=el.type==='checkbox'?el.checked:el.value},true);
function restoreSubDraft(){const f=$('#subForm');if(!f||f.dataset.restored)return;f.dataset.restored=1;
  Object.entries(SUBDRAFT).forEach(([id,v])=>{const el=document.getElementById(id);if(!el)return;if(el.type==='checkbox')el.checked=!!v;else el.value=v});
  const a=SUBFILES.sbAudio,c=SUBFILES.sbCover;if(a){$('#sbAudioInfo').textContent=a.name+' · '+fmtSize(a.size)+' · ✓';$('#sbAudio').required=false}
  if(c){const im=$('#sbCoverPrev');if(im){im.hidden=false;im.src=URL.createObjectURL(c)}$('#sbCover').required=false}}
const subFile=id=>($(id).files&&$(id).files[0])||SUBFILES[id.slice(1)];

/* Envoi d'un fichier avec pourcentage (utile sur les connexions lentes) */
async function subUpload(path,file,type){const base=SB&&SB.supabaseUrl,key=SB&&SB.supabaseKey;
  if(!base||!key||typeof XMLHttpRequest==='undefined'){const r=await SB.storage.from(SUB_BUCKET).upload(path,file,{contentType:type,upsert:false});if(r.error)throw r.error;return}
  const {data}=await SB.auth.getSession();const tok=data&&data.session&&data.session.access_token;if(!tok)throw new Error('Your session has expired. Please sign in again.');
  await new Promise((ok,ko)=>{const x=new XMLHttpRequest();x.open('POST',`${base}/storage/v1/object/${SUB_BUCKET}/${path.split('/').map(encodeURIComponent).join('/')}`);
    x.setRequestHeader('Authorization','Bearer '+tok);x.setRequestHeader('apikey',key);x.setRequestHeader('Content-Type',type);x.setRequestHeader('x-upsert','false');x.setRequestHeader('cache-control','max-age=3600');
    x.upload.onprogress=e=>{if(e.lengthComputable)subProgress(null,Math.round(e.loaded/e.total*100))};
    x.onload=()=>{if(x.status>=200&&x.status<300)return ok();let m='Upload failed ('+x.status+')';try{const j=JSON.parse(x.responseText);m=j.message||j.error||m}catch(e){}ko(new Error(m))};
    x.onerror=()=>ko(new Error('The connection was lost during the upload. Check your internet connection and try again.'));x.ontimeout=x.onerror;x.send(file)})}
function subProgress(msg,pct){if(msg!==null)SUBSTATE.msg=msg;if(pct!==undefined)SUBSTATE.pct=pct;const p=$('#sbProg');if(p){p.hidden=false;p.querySelector('span').textContent=SUBSTATE.msg;$('#sbPct').textContent=SUBSTATE.pct>=0?SUBSTATE.pct+'%':''}
  const bar=$('#sbBar');if(bar){bar.parentElement.hidden=SUBSTATE.pct<0;bar.style.width=Math.max(0,SUBSTATE.pct)+'%'}}
function subFail(msg,field){SUBSTATE.err=msg;const e=$('#sbErr');if(e){e.textContent=msg;e.scrollIntoView({behavior:'smooth',block:'center'})}toast(msg);
  if(field){const f=$(field);if(f){f.classList.add('bad');setTimeout(()=>f.focus({preventScroll:true}),350);f.addEventListener('input',()=>f.classList.remove('bad'),{once:true});f.addEventListener('change',()=>f.classList.remove('bad'),{once:true})}}}
async function sendSubmission(form){if(SUBSTATE.busy)return;SUBSTATE.err='';const e0=$('#sbErr');if(e0)e0.textContent='';
  try{await sendSubmissionInner(form)}catch(x){console.error(x);SUBSTATE.busy=false;SUBSTATE.pct=-1;subFail('Something went wrong: '+((x&&x.message)||x)+'. Please try again.');rerender()}}
async function sendSubmissionInner(form){const err={set textContent(m){subFail(m,null)}};
  if($('#sbWebsite').value)return;                                   /* robot */
  const edit=SUBEDIT&&(MYSUBS.list||[]).find(x=>x.id===SUBEDIT);
  const v=id=>$(id).value.trim(),title=v('#sbTitle'),artists=v('#sbArtists'),genre=v('#sbGenre'),country=v('#sbCountry'),email=v('#sbEmail').toLowerCase(),phone=v('#sbPhone');
  const af=subFile('#sbAudio'),cf=subFile('#sbCover');
  const links={};for(const [k,l] of SUB_LINKS){const u=v('#sbL_'+k);if(u){if(!/^https:\/\/[^\s]+\.[^\s]+$/i.test(u))return subFail(`${l}: enter a full link starting with https://`,'#sbL_'+k);links[k]=u.slice(0,300)}}
  if(!edit&&!af)return subFail('Choose the audio file of your song (MP3 or WAV).','#sbAudio');
  if(!title)return subFail('Enter the song title.','#sbTitle');if(!artists)return subFail('Enter the artist name(s).','#sbArtists');
  if(!genre)return subFail('Choose a genre.','#sbGenre');if(!country)return subFail('Enter the country of origin.','#sbCountry');
  if(!edit&&!cf)return subFail('Add the cover artwork of the song.','#sbCover');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return subFail('Enter a valid email address.','#sbEmail');
  if(!/^\+?[0-9 ().\/-]{6,40}$/.test(phone))return subFail('Enter a valid phone number (with the country code, e.g. +243…).','#sbPhone');
  let aType='',cType='';
  if(af){if(af.size>SUB_AUDIO_MAX)return subFail(`The audio file is ${fmtSize(af.size)}. The maximum is 50 MB — export it as MP3 (320 kbps) to reduce the size.`,'#sbAudio');aType=await sniffFile(af);if(!/^audio\//.test(aType))return subFail('This file is not a real MP3 or WAV audio file. Export your song again as MP3 or WAV.','#sbAudio')}
  if(cf){if(cf.size>SUB_COVER_MAX)return subFail('The cover is too large (8 MB maximum).','#sbCover');cType=await sniffFile(cf);if(!/^image\//.test(cType))return subFail('The cover must be a JPG, PNG or WebP image.','#sbCover')}
  if(!$('#sbRights').checked)return subFail('Please tick the box to confirm that you have the rights to submit this song.','#sbRights');
  const id=edit?edit.id:(crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));
  const stamp=Date.now().toString(36),uploaded=[];
  SUBSTATE.busy=true;SUBSTATE.pct=-1;const btn0=$('.subsend');if(btn0){btn0.disabled=true;btn0.textContent='SENDING…'}const say=(t,p)=>subProgress(t,p===undefined?-1:p);
  try{let audio_path=edit?.audio_path,cover_path=edit?.cover_path||'';
    if(af){say(`Uploading your song (${fmtSize(af.size)})…`,0);audio_path=`${UID}/${id}/audio-${stamp}.${subExt[aType]}`;
      await subUpload(audio_path,af,aType);uploaded.push(audio_path)}
    if(cf){say('Uploading the cover…',0);cover_path=`${UID}/${id}/cover-${stamp}.${subExt[cType]}`;
      await subUpload(cover_path,cf,cType);uploaded.push(cover_path)}
    say('Saving your submission…');
    const row={title,artists,genre,country,description:v('#sbDesc').slice(0,1500),links,email,phone,audio_path,cover_path,rights_ok:true,
      ...(af?{audio_name:af.name.slice(0,200),audio_size:af.size,audio_type:aType}:{})};
    const r=edit?await SB.from('music_submissions').update(row).eq('id',id).select():await SB.from('music_submissions').insert({id,...row}).select();
    if(r.error)throw r.error;if(!r.data||!r.data.length)throw new Error('row-level');
    /* anciens fichiers remplacés */
    if(edit){const old=[af&&edit.audio_path,cf&&edit.cover_path].filter(Boolean);if(old.length)SB.storage.from(SUB_BUCKET).remove(old).catch(()=>{})}
    const saved=r.data[0];const m=api.me();m.subSeen=m.subSeen||{};m.subSeen[id]=saved.status+'|'+saved.updated_at;
    notify({key:'sub-'+id+'-sent-'+saved.updated_at,text:edit?`Your update of “${title}” was received. The WMA team will review it again.`:`We received “${title}”. The WMA team will listen to it and get back to you here.`,href:'#submit'});saveMe();
    SUBSTATE={busy:false,msg:'',err:'',pct:-1};SUBDRAFT={};SUBFILES={};SUBEDIT=null;MYSUBS.list=[saved,...(MYSUBS.list||[]).filter(x=>x.id!==id)];rerender();toast(edit?'Update sent':'Submission sent — thank you!');
    setTimeout(()=>{const s=$('#msTitle');s&&s.scrollIntoView({behavior:'smooth',block:'start'})},100)}
  catch(e){if(uploaded.length)SB.storage.from(SUB_BUCKET).remove(uploaded).catch(()=>{});SUBSTATE.busy=false;SUBSTATE.pct=-1;rerender();subFail(/bucket|not found/i.test((e&&e.message)||'')?'Submissions are not set up yet on the server. (WMA team: run 05-soumissions.sql in Supabase.)':subSetupErr(e))}}

/* ---------- WMA ADMIN : soumissions ---------- */
async function loadAdmSubs(){if(!supa()||ADMSUBS.loading)return;ADMSUBS.loading=true;ADMSUBS.tried=true;
  try{const r=await SB.from('music_submissions').select('*').order('created_at',{ascending:false});if(r.error)throw r.error;ADMSUBS.list=(r.data||[]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));ADMSUBS.err=null}
  catch(e){ADMSUBS.err=subSetupErr(e)}ADMSUBS.loading=false;if(location.hash==='#admin-submissions')rerender()}
function admSubFiltered(){const f=ADMSUBS.f,q=f.q.toLowerCase();return (ADMSUBS.list||[]).filter(s=>(f.status==='all'||s.status===f.status)&&(!f.genre||s.genre===f.genre)&&(!f.country||s.country===f.country)
  &&(!f.from||new Date(s.created_at)>=new Date(f.from))&&(!f.to||new Date(s.created_at)<=new Date(f.to+'T23:59:59'))&&(!q||[s.title,s.artists,s.email].join(' ').toLowerCase().includes(q)))}
admin.submissions=()=>{
  if(!supa())return '<div class="empty">Submissions are stored on Supabase: they are available on the online version (wmamusic.net).</div>';
  if(ADMSUBS.list===null&&!ADMSUBS.loading&&!ADMSUBS.tried)setTimeout(loadAdmSubs,0);
  const all=ADMSUBS.list||[],f=ADMSUBS.f,cnt=k=>all.filter(s=>k==='all'||s.status===k).length,uniq=k=>[...new Set(all.map(s=>s[k]).filter(Boolean))].sort();
  const rows=admSubFiltered();
  return `<div class="studio-head"><h2>Music submissions</h2><button class="btn" data-act="admSubRefresh">↻ Refresh</button></div>
   <p class="muted" style="margin-top:4px">Songs sent by artists from “Submit your music”. Files are private and never published automatically.</p>
   <div class="tchips" role="tablist" aria-label="Status">${['all','pending','review','changes','accepted','rejected'].map(k=>`<button class="tchip ${f.status===k?'on':''}" role="tab" aria-selected="${f.status===k}" data-act="admSubF" data-k="status" data-v="${k}">${k==='all'?'All':SUB_ST[k].l} <span class="mono">${cnt(k)}</span></button>`).join('')}</div>
   <div class="subfilters"><input type="search" placeholder="Search title, artist or email" value="${esc(f.q)}" data-subf="q" aria-label="Search">
    <select data-subf="genre" aria-label="Genre"><option value="">All genres</option>${uniq('genre').map(g=>`<option ${f.genre===g?'selected':''}>${esc(g)}</option>`).join('')}</select>
    <select data-subf="country" aria-label="Country"><option value="">All countries</option>${uniq('country').map(g=>`<option ${f.country===g?'selected':''}>${esc(g)}</option>`).join('')}</select>
    <label class="t2">From <input type="date" value="${esc(f.from)}" data-subf="from"></label><label class="t2">To <input type="date" value="${esc(f.to)}" data-subf="to"></label></div>
   ${ADMSUBS.err?`<div class="err">${esc(ADMSUBS.err)}</div>`:''}
   ${ADMSUBS.list===null?(ADMSUBS.err?'':'<div class="empty">Loading…</div>'):rows.length?`<div class="tbl-wrap"><table class="tbl subtbl"><thead><tr><th>Song</th><th>Genre</th><th>Country</th><th>Received</th><th>Status</th><th></th></tr></thead><tbody>
    ${rows.map(s=>`<tr><td><div class="subtd">${s.cover_path?`<img alt="" data-subsrc="${esc(s.cover_path)}">`:'<span></span>'}<div style="min-width:0"><b>${esc(s.title)}</b><div class="t2">${esc(s.artists)}</div></div></div></td><td>${esc(s.genre)}</td><td>${esc(s.country)}</td><td class="mono">${subDate(s.created_at)}</td><td>${subStatus(s.status)}</td><td><button class="btn sm" data-act="admSubOpen" data-id="${s.id}">Open</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No submission matches these filters.</div>'}`};
function admSubModal(id){const s=(ADMSUBS.list||[]).find(x=>x.id===id);if(!s)return;const pr=PROFILES[s.user_id]||{};

async function premToken(){try{const {data}=await SB.auth.getSession();return data&&data.session?data.session.access_token:''}catch(e){return ''}}
async function premApi(action,{method='GET',query='',body}={}){

const offTx=(mode,fn)=>offOpen().then(db=>new Promise((ok,ko)=>{const tx=db.transaction('tracks',mode),st=tx.objectStore('tracks');const r=fn(st);tx.oncomplete=()=>ok(r&&r.result);tx.onerror=()=>ko(tx.error)}));
async function offIndex(){try{const all=await offTx('readonly',st=>st.getAll());OFF.ids=new Set();OFF.meta={};
  for(const x of all||[]){if(x.uid&&UID&&x.uid!==UID)continue;OFF.ids.add(x.id);const {audio,cover,...m}=x;OFF.meta[x.id]={...m,hasCover:!!cover,size:audio?audio.size:0}}}catch(e){}}
const isDownloaded=id=>OFF.ids.has(id);
async function offGet(id){try{return await offTx('readonly',st=>st.get(id))}catch(e){return null}}
async function offSave(id){
  const t=api.track(id);if(!t)return;
  if(!api.me())return needLogin('Sign in to download songs.');
  if(!isPremium()){toast('Downloads are a Premium feature.');location.hash='#premium';closeModal();return}
  if(isDownloaded(id)){toast('Already downloaded');return}
  if(OFF.busy.has(id))return;OFF.busy.add(id);toast('Downloading “'+t.title+'”…');offMark(id);
  try{const r=await premApi('download',{query:'&track='+encodeURIComponent(id)});
    if(r.http===403){await premLoad(true);premRefresh();throw new Error('Your Premium subscription is not active.')}
    let audio;
    if(r.demo)audio=await (await fetch(await (_demoUrlPrem||demoUrl)(t))).blob();
    else if(r.url){const a=await fetch(r.url);if(!a.ok)throw new Error('The audio file could not be downloaded.');audio=await a.blob()}
    else throw new Error('This song cannot be downloaded.');
    let cover=null;try{const cu=trackCover(t);const c=await fetch(cu);if(c.ok)cover=await c.blob()}catch(e){}
    const a=api.artist(t.artistId);
    await offTx('readwrite',st=>st.put({id:t.id,uid:UID,title:t.title,artistId:t.artistId,artistName:a?a.name:'',featIds:t.featIds||[],featNames:(t.featIds||[]).map(x=>api.artist(x)?.name||''),
      albumId:t.albumId||null,genre:t.genre||'',duration:t.duration||0,demo:!!t.demo,savedAt:Date.now(),audio,cover}));
    await offIndex();toast('Downloaded — available offline');
  }catch(e){toast(e.message||'Download failed. Check your connection and try again.')}
  OFF.busy.delete(id);offMark(id);if(/^#library-downloads/.test(location.hash))rerender()}
async function offRemove(id){try{await offTx('readwrite',st=>st.delete(id))}catch(e){}if(OFF.urls[id]){URL.revokeObjectURL(OFF.urls[id]);delete OFF.urls[id]}await offIndex();offMark(id);toast('Removed from downloads');if(/^#library-downloads/.test(location.hash))rerender()}
async function offRemoveAll(){for(const id of [...OFF.ids])try{await offTx('readwrite',st=>st.delete(id))}catch(e){}await offIndex();rerender()}
function offMark(id){document.querySelectorAll(`[data-dl="${id}"]`).forEach(b=>{const on=isDownloaded(id),busy=OFF.busy.has(id);b.dataset.act=on?'dlRemove':'dlTrack';b.classList.toggle('on',on);b.disabled=busy;
  b.innerHTML=busy?`${PI.dl} Downloading…`:on?`${PI.done} Downloaded`:`${PI.dl} Download`;b.setAttribute('aria-label',on?'Remove download':'Download for offline listening')})}

  return _audioSrcPrem.apply(this,arguments)};

// Hors connexion : rend les chansons téléchargées visibles et jouables même sans catalogue en ligne.
async function offInject(){
  // sans internet et session expirée : on reconnaît le dernier compte utilisé sur cet appareil, pour ses téléchargements seulement
  if(!navigator.onLine&&!api.me()&&!art()){try{const l=JSON.parse(localStorage.getItem('wma_last_user')||'null');if(l&&l.id){UID=l.id;ME={...emptyMe(),id:l.id,name:l.name||'You',hue:24};PEOPLE=[ME];chrome()}}catch(e){}}
  await offIndex();let added=0;
  for(const id of OFF.ids){const m=OFF.meta[id];if(api.track(id))continue;let cover=null;
    if(m.hasCover){const x=await offGet(id);if(x&&x.cover)cover=URL.createObjectURL(x.cover)}
    if(!api.artist(m.artistId))DB.artists.push({id:m.artistId,name:m.artistName||'Unknown artist',hue:24});
    (m.featIds||[]).forEach((f,i)=>{if(!api.artist(f))DB.artists.push({id:f,name:m.featNames[i]||'',hue:24})});
    DB.tracks.push(normTrack({id,title:m.title,artistId:m.artistId,featIds:m.featIds||[],genre:m.genre,duration:m.duration,status:'published',audioId:'offline/'+id,cover:cover||undefined,demo:false,offline:true}));added++}
  if(added)scheduleRender()}

const BK={rows:[],artistId:'',mode:'new',busy:false,cover:null,coverFromTags:false,done:false};
/* ---- lecture des tags ID3 (MP3) ---- */
async function id3Read(file){
  try{const head=new Uint8Array(await file.slice(0,10).arrayBuffer());
    if(head[0]!==0x49||head[1]!==0x44||head[2]!==0x33)return {};
    const ver=head[3],size=(head[6]&127)<<21|(head[7]&127)<<14|(head[8]&127)<<7|(head[9]&127);
    const b=new Uint8Array(await file.slice(10,10+Math.min(size,8*1048576)).arrayBuffer());
    const out={};let p=0;if(head[5]&0x40&&ver>=3){const ext=ver===4?((b[0]&127)<<21|(b[1]&127)<<14|(b[2]&127)<<7|(b[3]&127)):((b[0]<<24|b[1]<<16|b[2]<<8|b[3])+4);p=ext}
    const txt=(enc,arr)=>{try{if(enc===0)return new TextDecoder('latin1').decode(arr);if(enc===1)return new TextDecoder('utf-16').decode(arr);if(enc===2)return new TextDecoder('utf-16be').decode(arr);return new TextDecoder('utf-8').decode(arr)}catch(e){return ''}};
    const clean=s=>s.replace(/\u0000+$/,'').replace(/\u0000/g,' / ').trim();
    while(p+10<=b.length){const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
      const fs=ver===4?((b[p+4]&127)<<21|(b[p+5]&127)<<14|(b[p+6]&127)<<7|(b[p+7]&127)):(b[p+4]<<24|b[p+5]<<16|b[p+6]<<8|b[p+7]);
      const d=b.subarray(p+10,p+10+fs);p+=10+fs;if(fs<=0||fs>b.length)break;
      if(/^(TIT2|TPE1|TRCK|TALB|TCON|TYER|TDRC)$/.test(id))out[id]=clean(txt(d[0],d.subarray(1)));
      else if(id==='APIC'&&!out.pic){const enc=d[0];let i=1;while(i<d.length&&d[i]!==0)i++;const mime=txt(0,d.subarray(1,i))||'image/jpeg';i+=2;
        if(enc===1||enc===2){while(i+1<d.length&&!(d[i]===0&&d[i+1]===0))i+=2;i+=2}else{while(i<d.length&&d[i]!==0)i++;i++}
        out.pic=new Blob([d.slice(i)],{type:/^image\//.test(mime)?mime:'image/jpeg'})}}
    return out}catch(e){return {}}}

/* ---------- Pochettes automatiques : photo de l'artiste le plus écouté de chaque playlist ----------
   S'applique aux playlists sans image choisie à la main (automatiques, officielles en mode « Automatique », et playlists des auditeurs).
   Classement réel WMA MUSIC : écoutes comptées de l'artiste, puis abonnés, puis nombre de chansons dans la playlist.
   La playlist New Music Friday garde sa règle (artiste de la 1re chanson). */
const AUTOCOV={},AUTOBUSY={};
function plLeadArtist(ids){const n={};
  (ids||[]).forEach(id=>{const t=api.track(id);if(!t||!isLive(t))return;[t.artistId,...(t.featIds||[])].forEach(a=>{if(a)n[a]=(n[a]||0)+1})});
  const arts=Object.keys(n).map(api.artist).filter(a=>a&&artistPhoto(a));if(!arts.length)return null;
  const sc=a=>[stat.artistPlays(a.id)||0,stat.followers(a.id)||0,n[a.id]];
  return arts.sort((x,y)=>{const a=sc(x),b=sc(y);return b[0]-a[0]||b[1]-a[1]||b[2]-a[2]||x.name.localeCompare(y.name)})[0]}
const _plCoverAuto=plCover;plCover=p=>{
  const base=_plCoverAuto(p);
  if(!p||p.id==='smart-nmf'||(!p.smart&&(p.coverId||p.cover)))return base;
  const a=plLeadArtist(p.trackIds);if(!a)return base;
  const src=artistPhoto(a),key=p.id+'|'+p.name+'|'+a.id+'|'+src;
  if(AUTOCOV[key])return AUTOCOV[key];
  if(!AUTOBUSY[key]){AUTOBUSY[key]=1;
    makeArtistCover(src,p.name,true).then(b=>{const u=URL.createObjectURL(b);AUTOCOV[key]=u;
      document.querySelectorAll('img').forEach(im=>{if(im.getAttribute('src')===base)im.src=u})}).catch(()=>{})}
  return base};

document.addEventListener('click',async e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='mailAdmReload'){e.preventDefault();MAIL.adm=null;MAIL.admErr='';MAIL.dueRun=false;rerender()}
  else if(a==='mailSend'||a==='mailResume'){e.preventDefault();if(el.disabled)return;
    const r0=a==='mailSend'?mailReleases().find(x=>x.kind===el.dataset.k&&x.id===el.dataset.id):null;
    if(a==='mailSend'){const n=(MAIL.adm&&MAIL.adm.opted_in)||0;
      openModal(`<h3>${r0&&r0.live?'Send the email':'Email on release day'}</h3><p class="muted">“${esc(r0?r0.title:'')}”${r0&&r0.artist?' — '+esc(r0.artist):''}</p>
        <p style="margin:12px 0">${r0&&r0.live?`An email will be sent now to the <b>${n}</b> listener(s) who accepted new-release emails.`:`The email will be sent automatically on release day (${esc(new Date(r0.at).toLocaleString('en-GB'))}) to the listeners who accepted. Open WMA ADMIN that day, or set up the daily automatic sending, so it goes out.`}</p>
        <div class="err" id="mailE"></div><div class="actions" style="margin-top:0"><button class="btn pri" id="mailGo">${r0&&r0.live?'Send now':'Schedule'}</button><button class="btn" type="button" data-act="close">Cancel</button></div>`);
      $('#mailGo').onclick=async()=>{const b=$('#mailGo');b.disabled=true;b.textContent='Sending…';const r=await mailApi('send',{kind:el.dataset.k,id:el.dataset.id});
        if(r.http===200){closeModal();const c=r.campaign||{};toast(r.scheduled?'Email scheduled for release day':c.status==='done'?`Email sent to ${c.sent} listener(s)`:c.status==='paused'?`${c.sent} sent — paused: ${mailNote(c.note)}`:'Sending started');MAIL.adm=null;rerender()}
        else{b.disabled=false;b.textContent='Try again';$('#mailE').textContent=r.error==='already_exists'?'An email was already created for this release.':r.error==='not_live'?'This release is not published or scheduled.':r.error==='mail_not_configured'?'Resend is not configured (RESEND_API_KEY and MAIL_FROM in Vercel).':r.error==='forbidden'?'Access denied':(r.detail||r.error||'This could not be sent.')}}}
    else{el.disabled=true;const r=await mailApi('send',{campaignId:el.dataset.c});const c=r.campaign||{};toast(r.http===200?(c.status==='done'?'Email sent':`${c.sent||0} sent${c.note?' — '+mailNote(c.note):''}`):(r.detail||r.error||'This could not be sent.'));MAIL.adm=null;rerender()}}
  else if(a==='mailCancel'){e.preventDefault();const r=await mailApi('cancel',{campaignId:el.dataset.c});toast(r.http===200?'Email cancelled':'This could not be saved.');MAIL.adm=null;rerender()}
},true);

function i18nLookup(s,attr){
  if(I18N.lang==='fr'){
    const v=I18N_MORE[s]??I18N_FR[s];if(v!=null)return v;
    if(!attr&&I18N_ATTR_ONLY.some(r=>r.test(s)))return null;
    for(const [rx,f] of I18N_FR_RX.concat(I18N_EXTRA_RX)){const m=s.match(rx);if(m)return f(...m)}
    if(s.endsWith(':')){const b=I18N_MORE[s.slice(0,-1)]??I18N_FR[s.slice(0,-1)];if(b)return b+' :'}
    return null;
  }
  const v=I18N_EN_FIX[s];if(v!=null)return v;
  for(const [rx,f] of I18N_EN_RX){const m=s.match(rx);if(m)return f(...m)}
  return null;
}

    logout(){if(supa()){SB.auth.signOut();toast('You are signed out');location.hash='#home';return}LSESSION=null;store.set('session2',null);ME=null;toast('You are signed out');location.hash='#home';chrome();rerender()},
    sfilter(){searchState.f=el.dataset.f;rerender()},sgenre(){searchState.q=el.dataset.g;rerender()},close(){closeModal()},
    share(){openShare(el.dataset.k,id)},
    heroGo(){heroShow(HERO_I+(+el.dataset.d))},heroTo(){heroShow(+el.dataset.n)},
    ctl(){({play:toggle,next:()=>next(false),prev,shuffle:()=>$('#bShuffle').click(),repeat:()=>$('#bRepeat').click()})[el.dataset.c]()}
  };
  if(acts[a])acts[a]();else if(adminActs[a]&&api.isAdmin())adminActs[a](el,id);
});
$('#topSearch').addEventListener('input',e=>{searchState.q=e.target.value;if(!location.hash.startsWith('#search'))location.hash='#search';else{const r=$('#sResults');if(r)r.innerHTML=searchResults();const ps=$('#pageSearch');if(ps)ps.value=e.target.value}});
function openModal(h,wide){const m=$('#modal');m.innerHTML=`<div class="modal-box${wide?' wide':''}" role="dialog" aria-modal="true">${h}</div>`;m.hidden=false;const f=m.querySelector('input:not([type=file]),select,button');f&&f.focus()}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!$('#modal').querySelector('[data-busy]'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').querySelector('[data-busy]'))closeModal();if(e.code==='Space'&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();toggle()}});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3000)}
function confirmModal(text,label,fn){openModal(`<h3>Confirm</h3><p class="muted">${text}</p><div class="actions"><button class="btn pri" id="cfOk" style="background:var(--bad);color:#fff">${label}</button><button class="btn" data-act="close">Cancel</button></div>`);$('#cfOk').onclick=async()=>{$('#cfOk').disabled=true;try{await fn()}catch(e){toast(e.message||'This action could not be completed.')}closeModal()}}

/* =========================================================
   NAVIGATION
   ========================================================= */
function chrome(){
  const h=location.hash.slice(1)||'home',m=api.me(),is=k=>h===k||h.startsWith(k+'-'),adm=api.isAdmin();
  $('#sideNav').innerHTML=`<a href="#home" class="${is('home')?'on':''}">${I.home} Home</a><a href="#search" class="${is('search')?'on':''}">${I.search} Search</a><a href="#artists" class="${is('artists')||is('artist')?'on':''}">${I.star} Artists</a><a href="#library" class="${is('library')||is('favorites')?'on':''}">${I.lib} Library</a><a href="#profile" class="${is('profile')?'on':''}">${I.user} Profile</a>
   ${adm?`<div style="height:14px"></div><div class="nav-label">WMA ADMIN</div><a href="#admin-songs" class="${h==='admin-songs'?'on':''}">${I.star} Music manager</a><a href="#admin" class="${is('admin')&&h!=='admin-songs'?'on':''}">${I.admin} Administration</a><button class="btn pri" style="margin:8px 10px 0;width:calc(100% - 20px)" data-act="aTrack">${I.upload} ADD A SONG</button>`:''}
   ${m?`<div style="height:14px"></div><div class="nav-label">Your playlists</div>${(m.playlists||[]).slice(0,8).map(p=>`<a href="#playlist-${p.id}" class="${h==='playlist-'+p.id?'on':''}" style="font-weight:500">${esc(p.name)}</a>`).join('')||'<span class="muted" style="font-size:12.5px;padding:0 10px">None yet</span>'}`:''}`;
  $('#tabs').innerHTML=`<a href="#home" class="${is('home')?'on':''}">${I.home}Home</a><a href="#search" class="${is('search')?'on':''}">${I.search}Search</a><a href="#library" class="${is('library')||is('favorites')?'on':''}">${I.lib}Library</a><a href="#profile" class="${is('profile')||is('admin')?'on':''}">${adm?I.admin:I.user}${adm?'Admin':'Profile'}</a>`;
  $('#topActions').innerHTML=art()?(adm?`<button class="btn pri sm" data-act="aTrack">${I.plus} Song</button>`:'')+`<a class="me" href="#profile"><span style="width:32px">${avatar({name:MYNAME,hue:24},13)}</span><span class="t1" style="max-width:140px">${esc(MYNAME)}</span></a>`
    :m?(adm?`<button class="btn pri sm" data-act="aTrack">${I.plus} Song</button>`:'')+`<a class="me" href="#profile"><span style="width:32px">${avatar({name:m.name,hue:m.hue},13)}</span><span class="t1" style="max-width:140px">${esc(m.name)}</span></a>`:`<a class="btn ghost" href="#signup">Sign up</a><a class="btn pri" href="#login">Sign in</a>`;
}
function rerender(){
  const h=location.hash.slice(1)||'home',i=h.indexOf('-'),name=i>0?h.slice(0,i):h,arg=i>0?h.slice(i+1):undefined,fn=pages[name]||notFound;
  $('#view').innerHTML=fn(arg);bindForms();bindHero();bindReveal();refreshPlaying();if(name==='now')renderNowControls();
}
function route(){if(!$('#modal').querySelector('[data-busy]'))closeModal();chrome();rerender();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
bootLocal();route();renderPlayer();
const BOOT=bootSupa().then(ok=>{if(!ok)return bootCloud()}).catch(e=>console.warn('backend',e));
startIntro(BOOT);

</script>
