<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}/* ===== v3 : logo seul, accueil For You / Trending, profil artiste ===== */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.logo svg{flex:none}
#tabs{grid-template-columns:repeat(5,1fr)}
.htabs{display:flex;gap:10px;margin:0 0 20px}
.htab{height:42px;padding:0 22px;border-radius:999px;font-weight:700;font-size:16px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

.hero-slider.bn{border-radius:14px;background:#0B0B0B}
.bn .hs-slide{min-height:0;aspect-ratio:2.7/1}

.bn-line{position:absolute;top:0;right:0;bottom:0;width:64%;background:rgba(255,255,255,.75);clip-path:polygon(calc(24% - 3px) 0,24% 0,0 100%,-3px 100%)}
.bn-left{position:relative;z-index:1;width:42%;padding:clamp(14px,3vw,30px);display:flex;flex-direction:column;gap:4px;min-width:0}
.bn-title{font-size:clamp(17px,3vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bn-artist{font-style:italic;font-size:clamp(13px,2vw,21px);color:rgba(255,255,255,.88);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn-cov{margin-top:auto;width:clamp(56px,11vw,118px);aspect-ratio:1;object-fit:cover;border-radius:6px;border:2px solid rgba(255,255,255,.85)}
.bn-link{position:absolute;inset:0;z-index:2}
.bn-play{position:absolute;z-index:3;right:clamp(10px,2vw,20px);bottom:clamp(10px,2vw,20px);width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.bn .hs-nav{z-index:4}
.bn .hs-dots{z-index:4;left:50%;transform:translateX(-50%);bottom:10px;gap:7px}
.bn .hs-dots button{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.8)}
.bn .hs-dots button.on{background:var(--accent)}
.bn .hs-dots button i{display:none}
.fans-h{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.fans-av{width:56px;height:56px;flex:none;border-radius:50%;overflow:hidden}
.fans-av .av{width:100%;height:100%}
.fans-n{font-size:22px;font-weight:800;letter-spacing:-.01em}
.more{margin-left:auto;flex:none;height:32px;padding:0 12px;border-radius:6px;background:var(--surface2);color:var(--muted);font-weight:800;font-size:13px;letter-spacing:.04em;display:inline-flex;align-items:center}
.more:hover{color:var(--fg)}
.relcard{position:relative;display:flex;background:var(--surface);border-radius:12px;overflow:hidden;max-width:760px}
.relcov{width:clamp(110px,22vw,170px);aspect-ratio:1;flex:none}
.relcov img{width:100%;height:100%;object-fit:cover;display:block}
.reltxt{flex:1;min-width:0;padding:14px 70px 14px 18px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.reltxt .t1{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reltxt .kind{letter-spacing:.02em;margin-top:2px}
.relplay{position:absolute;right:16px;bottom:16px;width:46px;height:46px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.sec-h2{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sec-h2 h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.tchips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:14px}
.tchips::-webkit-scrollbar,.tgrid::-webkit-scrollbar,.rels::-webkit-scrollbar{display:none}
.tchip{flex:none;height:42px;padding:0 22px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:15px;color:var(--fg);background:transparent}
.tchip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tgrid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(4,auto);grid-auto-columns:min(440px,84%);column-gap:28px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.trow2{display:grid;grid-template-columns:60px minmax(0,1fr) 44px;gap:14px;align-items:center;padding:6px 0;scroll-snap-align:start}
.tr-cov{width:60px;height:60px;border-radius:6px;overflow:hidden;padding:0}
.tr-cov img{width:100%;height:100%;object-fit:cover;display:block}
.tr-txt{min-width:0}
.tr-txt .t1{display:block;font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-txt .t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow2.cur .t1,.ts-row.cur .t1{color:var(--accent)}
.ap-hero{position:relative;border-radius:20px;overflow:hidden;min-height:460px;display:flex;align-items:flex-end;background:radial-gradient(circle at 30% 20%,hsl(var(--h) 55% 30%),hsl(var(--h) 40% 10%))}
.ap-bg{position:absolute;inset:-40px;background:var(--bgimg) center 20%/cover no-repeat;filter:blur(34px) brightness(.6) saturate(1.2)}
.ap-img{position:absolute;top:0;right:0;bottom:0;width:60%;background:var(--bgimg) center 18%/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 45%);mask-image:linear-gradient(90deg,transparent 0,#000 45%)}
.ap-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 25%,rgba(0,0,0,.5) 55%,rgba(0,0,0,.92) 100%)}
.ap-in{position:relative;z-index:1;width:100%;padding:28px;display:flex;flex-direction:column;gap:10px}
.ap-name{font-size:clamp(36px,6vw,66px);font-weight:800;letter-spacing:-.035em;line-height:1}
.ap-sub{font-size:14.5px;color:rgba(255,255,255,.86)}
.ap-stats{display:flex;max-width:460px;margin-top:6px;padding:14px 0;border-radius:18px;background:rgba(60,60,60,.42);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.ap-stats div{flex:1;display:flex;flex-direction:column;gap:4px;padding:0 18px}
.ap-stats span{font-size:12.5px;color:rgba(255,255,255,.72)}

.ap-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.ap-play{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.ap-body{display:grid;grid-template-columns:46px minmax(0,1fr);gap:22px;margin-top:22px;align-items:start}
.ap-rail{position:sticky;top:80px;display:flex;flex-direction:column-reverse;gap:4px;padding:10px 0;border-radius:16px;background:var(--surface)}
.ap-rail button{writing-mode:vertical-rl;transform:rotate(180deg);width:100%;min-height:96px;padding:12px 0;font-size:13.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center}
.ap-rail button.on{color:var(--fg);font-weight:800;box-shadow:inset -3px 0 0 var(--accent)}
.ap-main{min-width:0}
.ap-main>.sec:first-child,.ap-main>.socs+.sec{margin-top:0}
.tsongs{display:flex;flex-direction:column}
.ts-row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:14px;align-items:center;padding:8px 0}
.ts-play{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.ts-play svg,.relplay svg,.bn-play svg{width:18px;height:18px}
.ts-txt{min-width:0}
.ts-txt .t1{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wave{display:flex;align-items:center;gap:2px;height:20px;margin-top:6px;overflow:hidden}
.wave i{flex:none;width:2px;border-radius:1px;background:var(--muted);opacity:.55}
.wave.on i{background:var(--accent);opacity:1}
.rels{display:grid;grid-auto-flow:column;grid-auto-columns:156px;gap:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.rel{min-width:0}
.rel img{width:156px;aspect-ratio:1;object-fit:cover;border-radius:24px;display:block}
.rel .t1{display:block;margin-top:8px;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel .t2{display:block;font-size:12.5px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface2)}
.seg button{height:36px;padding:0 18px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.st-panel{border-radius:22px}
.st-kpis{display:flex;gap:28px;flex-wrap:wrap;margin:6px 0 10px}
.st-kpis div{display:flex;flex-direction:column}
.st-kpis b{font-size:22px;font-weight:800}
.st-kpis span{font-size:12px;color:var(--muted)}
.sch{margin-top:8px}
.sch-plot{position:relative;height:200px;margin-right:36px}
.sch-plot svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.sch-dot{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--accent)}
.sch-dot.last{width:11px;height:11px;margin:-5.5px 0 0 -5.5px;box-shadow:0 0 0 4px rgba(255,122,26,.25)}
.sch-y{position:absolute;top:0;bottom:0;left:100%;width:36px}
.sch-y span{position:absolute;left:8px;transform:translateY(-50%);font-size:12px;color:var(--muted)}
.sch-x{position:relative;height:22px;margin:6px 36px 0 0}
.sch-x span{position:absolute;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap}
.sch-x span:first-child{transform:none}.sch-x span:last-child{transform:translateX(-100%)}
.slist{display:flex;flex-direction:column;margin-top:10px}
.srow{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;align-items:center;padding:8px 0}
.srow img,.srow .fl{width:46px;height:46px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--surface2);font-size:22px}
.srow .t1{font-weight:700}
@media (max-width:860px){

  .ap-in{padding:20px 16px 18px}

  .ap-stats b{font-size:19px}

  .ap-rail{top:70px}

/* Cartes « Find something new » */

.dchips .tchip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dcards{display:grid;grid-auto-flow:column;grid-auto-columns:min(460px,88%);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.dcards::-webkit-scrollbar{display:none}
.dcard{scroll-snap-align:start;background:var(--surface);border-radius:16px;padding:18px 18px 10px;min-width:0}
.dcard-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;min-height:36px}
.dcard-h h2{font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em}
.dcard-h span{font-size:28px;line-height:1;color:var(--muted)}
.drow{display:grid;grid-template-columns:72px minmax(0,1fr) 44px;gap:14px;align-items:center;padding:8px 0}
.dr-cov{width:72px;height:72px;border-radius:6px;overflow:hidden;padding:0}
.dr-cov img{width:100%;height:100%;object-fit:cover;display:block}
.dr-txt{min-width:0}
.dr-txt .t1{font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-txt .t2{display:block;font-size:15px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow.cur .t1{color:var(--accent)}
.dr-more{width:44px;height:44px}
.tmenu{display:flex;flex-direction:column}
.tm-h{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;padding-bottom:12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.tm-h img{width:56px;height:56px;border-radius:6px;object-fit:cover}
.tmenu>button,.tmenu>a{display:flex;align-items:center;gap:14px;min-height:48px;padding:0 4px;font-weight:600;font-size:15px;text-align:left;color:var(--fg);border-radius:8px}
.tmenu>button:hover,.tmenu>a:hover{background:var(--surface2)}
.tmenu>button svg,.tmenu>a svg{width:20px;height:20px;color:var(--muted)}
.tmenu .tm-cancel{justify-content:center;margin-top:6px;background:var(--surface2)}
@media (max-width:860px){.dcard{padding:16px 14px 8px}.dcard-h h2{font-size:17px}.drow{grid-template-columns:64px minmax(0,1fr) 40px;gap:12px}.dr-cov{width:64px;height:64px}}
/* Couverture des playlists (admin) */
.cvbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;min-width:0}
.cvbox legend{padding:0 6px;font-weight:600;font-size:13px}
.cvmodes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cvm{position:relative}

/* ===== Parcours d'ouverture ===== */
#intro{position:fixed;inset:0;z-index:1000;background:#000;display:grid;place-items:center;padding:24px;color:#fff;transition:opacity .42s ease,visibility 0s linear .42s}
#intro.out{opacity:0;visibility:hidden}
#intro.out .in-stage{transform:scale(1.06);transition:transform .42s ease}
.in-stage{display:flex;flex-direction:column;align-items:center;text-align:center}
.in-sun{width:min(132px,34vw);height:auto;overflow:visible;filter:drop-shadow(0 0 28px rgba(255,122,26,.35))}
.in-rot{transform-box:view-box;transform-origin:0 0;animation:inSpin 1.8s cubic-bezier(.2,.7,.2,1) both}
.in-sun .core{transform-box:view-box;transform-origin:0 0;animation:inPop .5s cubic-bezier(.3,1.5,.5,1) both}
.in-sun .ray{transform-box:view-box;transform-origin:0 0;animation:inRay .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.12s + var(--k) * .03s)}
.in-word{margin-top:26px;font-family:var(--display,inherit);font-size:clamp(28px,7vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1;animation:inUp .55s .62s cubic-bezier(.2,.7,.2,1) both}
.in-word em{font-style:normal;color:#FF7A1A}
.in-slogan{margin-top:12px;font-size:clamp(12px,3.4vw,14px);font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.72);animation:inUp .55s .78s cubic-bezier(.2,.7,.2,1) both}
.in-bar{margin-top:30px;width:140px;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;animation:inFade .3s .7s both}
.in-bar i{display:block;height:100%;width:40%;border-radius:2px;background:#FF7A1A;animation:inLoad 1s .7s ease-in-out infinite}
#intro.quick .in-rot,#intro.quick .core,#intro.quick .ray,#intro.quick .in-word,#intro.quick .in-slogan,#intro.quick .in-bar{animation-duration:.3s;animation-delay:0s}
#intro.quick .in-bar i{animation-delay:0s}
@keyframes inSpin{from{transform:rotate(-70deg)}to{transform:rotate(0)}}
@keyframes inPop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes inRay{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes inUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes inFade{from{opacity:0}to{opacity:1}}
@keyframes inLoad{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){#intro *{animation:none!important}#intro .in-bar i{width:100%}}
body.ob-lock{overflow:hidden}
#welcome{position:fixed;inset:0;z-index:900;background:#000;color:#fff;display:grid;place-items:center;overflow-y:auto;opacity:0;transition:opacity .35s ease;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
#welcome.in{opacity:1}
#welcome.out{opacity:0;pointer-events:none}
.wl-bg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(0,1fr);gap:4px;opacity:.85;overflow:hidden}
.wl-bg span{background:var(--bgimg) center 20%/cover no-repeat,#1C1C1E;filter:saturate(1.05);animation:wlKen 18s ease-in-out infinite alternate;animation-delay:calc(var(--k) * -2s)}
@keyframes wlKen{from{transform:scale(1)}to{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.wl-bg span,#welcome.in .wl-in>*{animation:none!important}}
.wl-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,.55) 38%,rgba(0,0,0,.9) 62%,#000 82%)}
.wl-in{position:relative;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
#welcome.in .wl-in>*{animation:inUp .5s cubic-bezier(.2,.7,.2,1) both}
#welcome.in .wl-in>*:nth-child(2){animation-delay:.05s}
#welcome.in .wl-in>*:nth-child(3){animation-delay:.1s}
#welcome.in .wl-in>*:nth-child(4){animation-delay:.15s}
#welcome.in .wl-in>*:nth-child(n+5){animation-delay:.2s}

/* Fond photos des pages Sign in / Create your account */

/* Proposition d'installation */

#installBar.on{transform:translate(-50%,0);opacity:1}
.ib-logo{width:48px;height:48px;border-radius:12px;background:#0A0A0A;color:#FF7A1A;display:grid;place-items:center;border:1px solid rgba(255,255,255,.08)}
.ib-txt{min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.4;color:rgba(255,255,255,.75)}

.ib-ico{display:inline-flex;vertical-align:-3px;color:#0A84FF}
.ib-act{display:flex;align-items:center;gap:6px}
#installBar .ib-go{height:40px;padding:0 18px;border-radius:999px;background:#FF7A1A;color:#0A0A0A;border:0;font-weight:800}
.ib-x{width:40px;height:40px;border-radius:50%;color:rgba(255,255,255,.7);font-size:16px;display:grid;place-items:center}
.ib-x:hover{background:rgba(255,255,255,.08);color:#fff}
@media (max-width:860px){#installBar{bottom:calc(var(--tabs) + var(--player) + 14px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){#installBar{transition:none}}

.ig-head{display:flex;gap:14px;align-items:center}
.ig-steps{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:10px}
.ig-steps li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;padding:12px;border-radius:12px;background:var(--surface2);font-size:15px;line-height:1.5}
.ig-steps li>b{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}

/* ===== Lecteur plein écran (style YouTube Music) ===== */
.ytnp{--tone:#2a2622;position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:0;background:linear-gradient(180deg,var(--tone) 0%,rgba(0,0,0,0) 72%),#0B0B0B;border-radius:20px;padding:14px 22px 26px;min-height:calc(100vh - 140px);transition:background-color .4s}
.yt-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.yt-ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff}
.yt-ic:hover{background:rgba(255,255,255,.08)}
.yt-seg{display:flex;padding:4px;border-radius:999px;background:rgba(0,0,0,.35)}
.yt-seg button{height:40px;padding:0 24px;border-radius:999px;font-weight:600;font-size:16px;color:rgba(255,255,255,.6)}
.yt-seg button.on{background:rgba(255,255,255,.16);color:#fff}
.yt-seg button:disabled{opacity:.45;cursor:not-allowed}
.yt-art{width:min(100%,560px);margin:0 auto;aspect-ratio:1;border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.yt-art img{width:100%;height:100%;object-fit:cover;display:block}
.yt-meta{margin:26px 0 0;min-width:0}
.yt-meta h1{font-size:clamp(26px,5vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.15;color:#fff;overflow-wrap:anywhere}
.yt-artist{margin-top:6px;font-size:18px;color:rgba(255,255,255,.72)}
.yt-artist a{color:inherit}
.yt-artist a:hover{color:#fff;text-decoration:underline}
.yt-pills{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:22px -22px 0;padding:0 22px 2px}
.yt-pills::-webkit-scrollbar{display:none}
.yt-pill{flex:none;display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-weight:600;font-size:15.5px}
.yt-pill:hover{background:rgba(255,255,255,.16)}
.yt-pill.on{background:rgba(255,122,26,.22);color:#FFB27A}
.yt-prog{margin-top:26px}
.yt-prog input[type=range]{width:100%;height:4px;margin:0;-webkit-appearance:none;appearance:none;border-radius:2px;background:linear-gradient(90deg,#fff var(--p,0%),rgba(255,255,255,.25) var(--p,0%));cursor:pointer}
.yt-prog input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.yt-prog input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0}
.yt-times{display:flex;justify-content:space-between;margin-top:10px;font-size:13.5px;color:rgba(255,255,255,.65)}
.yt-ctl{display:flex;align-items:center;justify-content:space-between;max-width:520px;margin:18px auto 0}
.yt-c{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff}
.yt-c svg{width:28px;height:28px}
.yt-c:first-child svg,.yt-c:last-child svg{width:24px;height:24px}
.yt-c.on{color:#FF7A1A}
.yt-c:hover{background:rgba(255,255,255,.08)}
.yt-play{width:84px;height:84px;border-radius:50%;background:#fff;color:#0A0A0A;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s}
.yt-play:active{transform:scale(.95)}
.yt-play .spin{border-color:rgba(0,0,0,.2);border-top-color:#0A0A0A}
.yt-right{margin-top:34px;min-width:0}
.yt-tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid rgba(255,255,255,.12)}
.yt-tabs button{height:54px;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.62);box-shadow:inset 0 -2px 0 transparent}
.yt-tabs button.on{color:#fff;box-shadow:inset 0 -2px 0 #fff}
.yt-tabs button:disabled{color:rgba(255,255,255,.25);cursor:not-allowed}
.yt-panel{padding-top:14px;min-width:0}
.yt-lyrics{white-space:pre-line;font-size:19px;line-height:1.7;font-weight:600;color:rgba(255,255,255,.9);max-width:640px}
body.np-open .player{display:none}
body.np-open main{padding-bottom:40px}
@media (min-width:1100px){
  .ytnp{grid-template-columns:minmax(0,1fr) minmax(0,440px);column-gap:40px;align-items:start}
  .yt-top{grid-column:1/-1}
  .yt-right{margin-top:0;position:sticky;top:20px}
  .yt-left{width:100%;max-width:500px;justify-self:center}

}
@media (max-width:860px){
  body.np-open .top,body.np-open .tabs{display:none}
  body.np-open main{padding-top:0;padding-bottom:24px}
  .ytnp{margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));border-radius:0;min-height:100vh;padding:calc(10px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
  .yt-top{margin-bottom:14px}
  .yt-seg button{height:38px;padding:0 20px;font-size:15px}
  .yt-art{width:min(100%,62vh)}
  .yt-meta{margin-top:22px}
  .yt-pills{margin:18px -20px 0;padding:0 20px 2px}
  .yt-pill{height:44px;padding:0 18px}
  .yt-play{width:78px;height:78px}
}
body.np-open .side{bottom:0}
body.no-track{--player:0px}
body.no-track .player{display:none}

/* ===== Soumission de morceaux ===== */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.subhero{padding:6px 0 18px}
.subhero h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.03em;margin:4px 0 8px}
.subhero>p{color:var(--muted);font-size:16px;max-width:60ch;margin:0}
.subhow{list-style:none;padding:0;margin:18px 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.subhow li{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.subhow b{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.subhow span{font-size:14px;line-height:1.35}
.subgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start;margin-top:8px}
.subpanel h2,.subside h2{font-size:20px;font-weight:800;margin:0 0 14px}
.subdrop{position:relative;border:2px dashed var(--line);border-radius:16px;padding:16px;margin-bottom:16px;background:var(--surface2)}
.subdrop label{display:flex;gap:14px;align-items:center;cursor:pointer;color:var(--fg)}
.subdrop label svg{flex:none;width:44px;height:44px;padding:10px;border-radius:12px;background:var(--accent);color:var(--accent-ink)}
.subdrop label span{display:flex;flex-direction:column}
.subdrop small{color:var(--muted)}
.subdrop input[type=file]{margin-top:12px;width:100%}
.subcovin{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.subcovin img{width:72px;height:72px;border-radius:8px;object-fit:cover;background:var(--surface2)}
.subcovin small{width:100%}
.subfs{border:0;padding:0;margin:6px 0 0}
.subfs legend{font-weight:700;font-size:14px;margin-bottom:8px;padding:0}
.subrights{display:flex;gap:12px;align-items:flex-start;text-align:left;margin:10px 0 4px;padding:14px;border-radius:12px;background:var(--surface2);font-size:14px;line-height:1.5}
.subrights input{flex:none;width:20px;height:20px;margin:2px 0 0;padding:0}
.subsend{height:52px;padding:0 28px;font-size:16px;font-weight:800;letter-spacing:.03em;border-radius:999px}
.hp{position:absolute!important;left:-9999px!important;width:1px!important;height:1px!important;opacity:0}
.subprog{display:flex;align-items:center;gap:12px;margin-top:12px;color:var(--muted);font-size:14px}
.subprog i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.subside{display:flex;flex-direction:column;gap:12px;min-width:0}
.subcard{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.subcov{width:72px;height:72px;border-radius:8px;object-fit:cover;background:var(--surface2)}
.subbody{min-width:0}
.subhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.subhead .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subst{flex:none;display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.st-pending{background:rgba(255,255,255,.1);color:var(--fg)}
.st-review{background:rgba(10,132,255,.18);color:#64B5FF}
.st-changes{background:rgba(255,204,0,.16);color:#FFD54A}
.st-accepted{background:rgba(52,199,89,.18);color:#5BE08A}
.st-rejected{background:rgba(255,69,58,.16);color:#FF8A80}
.substeps{list-style:none;padding:0;margin:12px 0 0;display:grid;grid-template-columns:repeat(3,1fr)}
.substeps li{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;font-size:11.5px;color:var(--muted)}
.substeps li i{width:12px;height:12px;border-radius:50%;background:var(--line);position:relative;z-index:1}
.substeps li::before{content:"";position:absolute;top:5px;left:12px;right:0;height:2px;background:var(--line)}
.substeps li:last-child::before{display:none}
.substeps li.done i,.substeps li.cur i{background:var(--accent)}
.substeps li.done::before{background:var(--accent)}
.substeps li.cur{color:var(--fg);font-weight:700}
.substeps li.cur.no i{background:#FF453A}
.subnote{margin:12px 0 4px;padding:12px 14px;border-radius:12px;background:var(--surface2);border-left:3px solid var(--accent);font-size:14px}
.subnote p{margin:4px 0 0;white-space:pre-line}
.subfilters{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px;align-items:center}
.subfilters input,.subfilters select{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);padding:0 12px;font:inherit}
.subfilters input[type=search]{flex:1 1 220px;min-width:0}
.subfilters label{display:flex;gap:6px;align-items:center}
.subtd{display:flex;gap:12px;align-items:center;min-width:200px}
.subtd img,.subtd>span{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--surface2);flex:none}
.tchip .mono{opacity:.7;margin-left:4px}
.subdhead{display:flex;gap:16px;align-items:center}
.subdcov{width:96px;height:96px;border-radius:10px;object-fit:cover;flex:none}
.subacts{flex-wrap:wrap}
.subhist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.subhist li{padding-left:14px;border-left:2px solid var(--line)}
@media (max-width:980px){.subgrid{grid-template-columns:minmax(0,1fr)}.subside.has{order:-1}}
@media (max-width:640px){.grid2{grid-template-columns:minmax(0,1fr)}.subhow{grid-template-columns:minmax(0,1fr)}.subdcov{width:72px;height:72px}.subsend{width:100%}}
.subform .bad{outline:2px solid #FF453A;outline-offset:2px;border-radius:8px}
.subbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.subbar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.subprog b{margin-left:auto;color:var(--fg)}

/* Page playlist (grande couverture + chansons en dessous) */
.plv{--bleed:28px;margin:-26px calc(-1 * var(--bleed)) 0;padding:26px var(--bleed) 0;background:linear-gradient(180deg,var(--tone) 0,color-mix(in srgb,var(--tone) 55%,var(--bg)) 300px,var(--bg) 560px);transition:background .4s}
.pl-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:end;padding:20px 0 26px;color:#fff}
.pl-back{display:none}
.pl-cov{width:232px;aspect-ratio:1;box-shadow:0 18px 50px rgba(0,0,0,.5);border-radius:6px;overflow:hidden;background:#222}
.pl-cov img{width:100%;height:100%;object-fit:cover;display:block}
.pl-info{min-width:0}

.pl-desc{margin:12px 0 0;color:rgba(255,255,255,.78);font-size:15px;line-height:1.5;max-width:60ch}
.pl-by{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px;color:#fff}

.pl-by-av.wma{background:#0A0A0A;color:#FF7A1A}
.pl-meta{margin-top:6px;color:rgba(255,255,255,.72);font-size:14px}
.pl-acts{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
.pl-l,.pl-r{display:flex;align-items:center;gap:6px}
.pl-ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.85)}
.pl-ic:hover{color:#fff;background:rgba(255,255,255,.1)}
.pl-ic.on{color:#FF7A1A}
.pl-play{width:60px;height:60px;border-radius:50%;background:#FF7A1A;color:#0A0A0A;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .15s}

.trow[data-id],.trow2[data-id],.drow[data-id],.ts-row[data-id]{cursor:pointer}

.slogan{font-family:var(--display);font-weight:800;font-size:clamp(34px,5.4vw,64px);line-height:.95;letter-spacing:-.03em;text-transform:uppercase}
.slogan span{display:block}
.slogan em{font-style:normal;color:var(--accent)}
.hero p{max-width:46ch;color:var(--muted);margin:18px 0 20px}
.feat{position:relative;z-index:1;display:flex;gap:16px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px}
.feat img{width:96px;height:96px;border-radius:8px;object-fit:cover;flex:none}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800}

/* Cartes */
.card{display:flex;flex-direction:column;gap:9px;min-width:0}
.cov{position:relative;aspect-ratio:1;max-width:100%;border-radius:var(--r);overflow:hidden;background:var(--surface2)}
.cov img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.card:hover .cov img{transform:scale(1.04)}
.cov .play{position:absolute;right:10px;bottom:10px;opacity:0;transform:translateY(6px);transition:.2s}
.card:hover .cov .play,.cov .play:focus-visible,.cov .play.is-on{opacity:1;transform:none}
@media (hover:none){.cov .play{opacity:1;transform:none}}
.pbtn{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.pbtn:hover{transform:scale(1.06)}
.card-t{display:flex;align-items:flex-start;gap:6px}
.card-t>div{flex:1;min-width:0}
.t1{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2 a:hover{color:var(--fg);text-decoration:underline}
.ic{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex:none}
.ic:hover{color:var(--fg);background:var(--surface2)}
.ic.on{color:var(--accent)}
.badge{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.1em;padding:2px 6px;border-radius:4px;background:var(--accent-soft);color:#FFB37A;vertical-align:middle}
.badge.off{background:rgba(255,92,122,.14);color:var(--bad)}
.badge.ok{background:rgba(61,214,140,.14);color:var(--good)}

/* Artistes */
.av{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:38px;color:#fff;background:radial-gradient(circle at 30% 25%,hsl(var(--h) 70% 52%),hsl(calc(var(--h) + 40) 60% 18%));overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.acard{text-align:center;display:flex;flex-direction:column;gap:9px;min-width:0}
.acard .t1,.acard .t2{text-align:center}

/* Listes de titres */
.tlist{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:28px 44px minmax(0,1fr) auto auto auto;align-items:center;gap:12px;padding:7px 8px;border-radius:8px}
.trow:hover{background:var(--surface2)}
.trow.cur .t1{color:var(--accent)}
.trow img{width:44px;height:44px;border-radius:6px;object-fit:cover}
.trow .n{color:var(--muted);text-align:center;font-size:13px}
.trow .d{color:var(--muted);font-size:12.5px}

/* En-tête de page (artiste, album, playlist) */
.phead{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line)}
.phead .art{width:200px;flex:none;max-width:100%}
.phead .art img{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.phead h1{font-size:clamp(30px,5vw,56px);font-weight:800;line-height:1}
.phead .meta{color:var(--muted);font-size:13.5px;margin-top:10px}
.phead .meta a{color:var(--fg);font-weight:700}
.phead .info{flex:1;min-width:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.bio{max-width:65ch;color:var(--muted);margin-top:12px}

/* Onglets / puces */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:12.5px;background:var(--surface)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.genres{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.genre{position:relative;height:96px;border-radius:12px;padding:14px;font-family:var(--display);font-weight:800;font-size:19px;overflow:hidden;text-align:left;background:hsl(var(--h) 55% 30%)}
.genre::after{content:"";position:absolute;right:-18px;bottom:-18px;width:76px;height:76px;border-radius:50%;border:14px solid rgba(255,255,255,.18)}

/* Formulaires */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.form{display:flex;flex-direction:column;gap:14px;max-width:440px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--surface2);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:inherit;font-size:14px;padding:10px 12px;width:100%}
.fld textarea{min-height:90px;resize:vertical}
.fld input[type=file]{padding:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted)}
.check input{margin-top:3px;accent-color:var(--accent)}
.err{color:var(--bad);font-size:13px;min-height:1em}
.auth{max-width:420px;margin:30px auto}
.auth h1{font-size:34px;margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{font-size:12.5px;color:var(--muted);border-left:2px solid var(--accent);padding:6px 0 6px 12px;max-width:72ch}

/* Admin */
.adm-nav{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 22px}
.adm-nav a{padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted);border:1px solid var(--line)}
.adm-nav a.on{color:var(--fg);background:var(--accent-soft);border-color:var(--accent)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td img{width:38px;height:38px;border-radius:6px;object-fit:cover;display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi b{display:block;font-family:var(--display);font-size:32px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:13px}
.bar i{display:block;height:6px;border-radius:3px;background:var(--accent);margin-top:5px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* ---------- Lecteur ---------- */
.player{position:fixed;left:0;right:0;bottom:0;height:calc(var(--player) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(22,22,24,.78);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:16px;z-index:30}
.p-now{display:flex;align-items:center;gap:12px;min-width:0}
.p-now img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:var(--surface2)}
.p-now>div{min-width:0}
.p-mid{display:flex;flex-direction:column;align-items:center;gap:6px}
.p-ctl{display:flex;align-items:center;gap:10px}
.p-ctl .ic{width:36px;height:36px}
.p-ctl .main{width:42px;height:42px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.p-ctl .main:hover{transform:scale(1.05)}
.p-prog{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;font-size:11.5px;color:var(--muted)}
.p-prog span{width:38px;text-align:center}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p,0%),var(--line) var(--p,0%));outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--fg);border:0}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--fg);border:0}
.p-right{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.p-right input{max-width:110px}
.p-mini-prog{display:none}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Page lecture */
.np{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:40px;align-items:start}
.np .bigcov{width:100%;aspect-ratio:1;border-radius:16px;object-fit:cover;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.np h1{font-size:clamp(28px,4vw,44px);font-weight:800;margin-top:22px}

/* ---------- Onglets mobiles ---------- */
.tabs{display:none}

/* Modale, toast */
.modal{position:fixed;inset:0;background:rgba(5,4,9,.72);z-index:80;display:grid;place-items:center;padding:16px}
.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:520px;max-height:86vh;overflow-y:auto}
.modal-box h3{font-size:20px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--player) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:13.5px;z-index:90;max-width:calc(100% - 32px);text-align:center}

/* ---------- Thème Apple Music (surcouche) ---------- */
h1,h2,h3{letter-spacing:-.022em}
.side{background:rgba(28,28,30,.72);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-right:1px solid rgba(255,255,255,.08)}
.logo b{font-weight:800;letter-spacing:-.03em}
.nav a{border-radius:7px;font-weight:500;color:var(--fg);font-size:14.5px}
.nav a svg{color:var(--accent)}
.nav a.on{background:rgba(255,255,255,.12)}
.nav-label{letter-spacing:.02em;text-transform:none;font-size:12px;font-weight:600}
.top{border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px)}
.searchbox{border-radius:9px;background:rgba(118,118,128,.24);border:0;height:36px}
.btn{border-radius:10px;border:0;background:rgba(118,118,128,.24);font-weight:600}
.btn:hover{background:rgba(118,118,128,.34)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;color:var(--accent)}
.ltitle{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:0 0 18px}
main h1[style*="font-size:34px"]{font-weight:800}
.sec{margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.sec-h h2{font-size:22px;font-weight:700}
.sec-h a{color:var(--accent);font-weight:500;letter-spacing:0;font-size:14px}
.sec-h a::after{content:" ›"}
.hero{background:linear-gradient(135deg,#2A1405 0%,#0D0703 55%,#000 100%);border:0;border-radius:14px}
.hero::after{border-color:rgba(255,122,26,.22)}
.slogan{text-transform:none;letter-spacing:-.04em;font-size:clamp(34px,5vw,58px);line-height:1}
.eyebrow{letter-spacing:.04em;font-size:11px;font-weight:700}
.feat{background:rgba(255,255,255,.06);border:0;backdrop-filter:blur(20px)}
.cov{border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.cov .play{left:10px;right:auto}
.pbtn{width:36px;height:36px;background:rgba(255,255,255,.85);color:#000;backdrop-filter:blur(10px)}
.t1{font-weight:500;font-size:13.5px}
.t2{font-size:13px}
.trow{border-radius:6px;padding:6px 10px;border-bottom:1px solid var(--line)}
.trow:hover{background:rgba(255,255,255,.06)}
.chip{border:0;background:rgba(118,118,128,.24);font-weight:600;border-radius:999px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.genre{border-radius:10px;background:linear-gradient(160deg,hsl(var(--h) 70% 42%),hsl(calc(var(--h) + 25) 70% 22%))}
.panel,.kpi,.tbl-wrap{border-color:var(--line);background:var(--surface)}
.phead{border-bottom:0}
.phead .art img{border-radius:10px}
.phead h1{font-weight:800;letter-spacing:-.035em}
.phead .meta a{color:var(--accent)}
.player{background:rgba(28,28,30,.78);border-top:1px solid rgba(255,255,255,.08)}
.p-now img{border-radius:6px}
.p-ctl .main{background:none;color:var(--fg);width:44px;height:44px}
.p-ctl .main svg{width:30px;height:30px}
.p-ctl .ic.on{color:var(--accent)}
.np .bigcov{border-radius:12px}
.modal-box{background:#1C1C1E;border:0;border-radius:14px}
.toast{background:rgba(44,44,46,.95);color:var(--fg);backdrop-filter:blur(20px)}
.fld input,.fld select,.fld textarea{background:rgba(118,118,128,.18);border:0;border-radius:9px}

/* ---------- WMA ADMIN : formulaire et gestion ---------- */
.modal-box.wide{max-width:720px}
.sform{max-width:none;gap:18px}
.sform fieldset{border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.sform legend{padding:0 6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.drop{position:relative}
.drop label{display:flex;align-items:center;gap:14px;padding:14px;border:1.5px dashed var(--line);border-radius:12px;cursor:pointer;color:var(--muted)}
.drop label:hover,.drop input:focus-visible+label{border-color:var(--accent);color:var(--fg)}
.drop label b{display:block;color:var(--fg);font-size:14px}
.drop label small{display:block;font-size:12px}
.drop label img{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none}
.drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:#2C2C2E;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.55);z-index:5;max-height:280px;overflow-y:auto}
.ac-list li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:14px}
.ac-list li small{margin-left:auto;color:var(--muted);font-size:12px}
.ac-list li.hi,.ac-list li[role=option]:hover{background:rgba(255,122,26,.18)}
.ac-list li.none{color:var(--muted);cursor:default}
.ac-list li svg{color:var(--accent)}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chipset:empty{display:none}
.fchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border-radius:999px;background:var(--accent-soft);color:#FFB37A;font-weight:600;font-size:13px}
.fchip button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px}
.fchip button:hover{background:rgba(255,255,255,.12)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(118,118,128,.24);border-radius:10px;padding:3px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;text-align:center;padding:9px 6px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.pv{display:flex;gap:14px;align-items:center}
.pv img{width:88px;height:88px;border-radius:8px;object-fit:cover;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.pv .t2{white-space:normal}
.sticky-actions{position:sticky;bottom:-22px;margin:0 -22px -22px;padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px));background:#1C1C1E;border-top:1px solid var(--line)}
.songs-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters select{flex:1 1 150px;min-width:0;height:36px;border-radius:9px;border:0;background:rgba(118,118,128,.24);color:var(--fg);font:inherit;font-size:13.5px;padding:0 10px}
.big-add{height:46px;padding:0 20px;font-size:14px;font-weight:800;letter-spacing:.02em;margin-bottom:18px}
.badge.warn{background:rgba(255,214,10,.14);color:var(--warn)}
a.bar{display:grid;grid-template-columns:minmax(0,1fr) 48px;padding:8px 0;border-bottom:1px solid var(--line)}
a.bar:hover span{color:var(--accent)}
td button img{display:block}
.row-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
@media (max-width:860px){
  .modal:has(.wide){padding:0}
  .modal-box.wide{max-width:none;height:100%;max-height:100%;border-radius:0;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .seg span{font-size:12px;padding:9px 2px}
}

/* Hero avec photo d'artiste en fond */
.hero.has-bg{background:linear-gradient(90deg,rgba(0,0,0,.94) 0%,rgba(0,0,0,.78) 38%,rgba(0,0,0,.25) 72%,rgba(0,0,0,.1) 100%),var(--bgimg) 72% 28%/cover no-repeat,#000;min-height:400px}
.hero.has-bg::after{display:none}
.hero.has-bg .feat{background:rgba(20,20,20,.62);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.hero.has-bg p{color:rgba(255,255,255,.82)}
@media (max-width:860px){.hero.has-bg{background:linear-gradient(0deg,rgba(0,0,0,.97) 0%,rgba(0,0,0,.9) 52%,rgba(0,0,0,.35) 68%,rgba(0,0,0,0) 85%),var(--bgimg) center 18%/cover no-repeat,#000;min-height:0;padding-top:250px;align-content:end}}

/* ---------- Diaporama d'accueil ---------- */
.hero-slider{position:relative;border-radius:16px;overflow:hidden;background:#000;isolation:isolate}
.hs-track{display:grid}
.hs-slide{grid-area:1/1;position:relative;min-height:420px;display:flex;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s linear .9s}
.hs-slide.on{opacity:1;visibility:visible;transition:opacity .9s ease,visibility 0s}
.hs-bg{position:absolute;inset:-40px;background:var(--bgimg) center 28%/cover no-repeat,#140a03;filter:blur(14px) saturate(1.15);transform:scale(1.05)}
.hs-bg-plain{background:linear-gradient(135deg,#2A1405,#000)}
.hs-slide.on .hs-bg{animation:hsZoom 9s ease-out forwards}
@keyframes hsZoom{from{transform:scale(1.05)}to{transform:scale(1.16)}}
.hs-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.62) 45%,rgba(0,0,0,.25) 100%)}
.hs-content{position:relative;z-index:1;flex:1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end;padding:36px 36px 52px}
.hs-text p{max-width:46ch;color:rgba(255,255,255,.84);margin:18px 0 20px}
.hs-name{font-size:clamp(36px,5.2vw,64px);font-weight:800;letter-spacing:-.035em;line-height:1;margin-top:10px}
.hs-slide.on .hs-text>*{animation:hsUp .8s cubic-bezier(.2,.7,.2,1) both}
.hs-slide.on .hs-text>*:nth-child(2){animation-delay:.08s}.hs-slide.on .hs-text>*:nth-child(3){animation-delay:.16s}.hs-slide.on .hs-text>*:nth-child(4){animation-delay:.24s}
.hs-slide.on .feat,.hs-slide.on .hs-portrait{animation:hsUp .9s .2s cubic-bezier(.2,.7,.2,1) both}

/* ---------- Catalogue de démonstration (mode local uniquement) ---------- */
const GENRES0=['Rumba','Ndombolo','Afrobeat','Afro-pop','Gospel','Rap','Amapiano'];
const ARTISTS0=[['innossb',"INNOSS'B",'RDC',''],['lhomanix','Lhomanix','RDC',''],['aspino','Aspino Boy','RDC',''],['jaguaman','Jaguaman','',''],['pascalmk','Pascal Mk','RDC',''],['osee','Osée Elektra','RDC',''],['bargoss','Bargoss','RDC',''],['balca','Balca Ls Sheguey','RDC',''],['mael','Maël Jedis','RDC',''],['belma','BELMA','RDC','https://youtube.com/@belmaofficial'],['tiga','TIGA DISIEL','RDC','']];
const BIO0={"innossb": "INNOSS'B is an artist from the Democratic Republic of the Congo. His sound blends afrobeats, hip-hop, ndombolo and Congolese rumba.", "lhomanix": "Lhomanix is an artist from the Democratic Republic of the Congo. Style: afrobeat and African music.", "jaguaman": "Jaguaman is an artist from the Democratic Republic of the Congo. Rooted in Congolese rumba, ndombolo and soukous, blended with rap, drill, afrobeats, pop and amapiano.", "osee": "Osée Elektra is an artist from Goma, in the Democratic Republic of the Congo. The music fuses slam, rap and traditional rhythms.", "aspino": "Aspino Boy is an artist from the Democratic Republic of the Congo.", "pascalmk": "Pascal Mk is an artist from the Democratic Republic of the Congo.", "bargoss": "Bargoss is an artist from the Democratic Republic of the Congo.", "balca": "Balca Ls Sheguey is an artist from the Democratic Republic of the Congo.", "mael": "Maël Jedis is an artist from the Democratic Republic of the Congo.", "belma": "BELMA is an artist from the Democratic Republic of the Congo.", "tiga": "TIGA DISIEL is an artist from the Democratic Republic of the Congo."};
const PHOTO0={"balca": "/artists/balca.jpg", "aspino": "/artists/aspino.webp", "tiga": "/artists/tiga.jpg", "bargoss": "/artists/bargoss.jpg", "jaguaman": "/artists/jaguaman.jpg", "osee": "/artists/osee.jpg", "lhomanix": "/artists/lhomanix.jpg", "mael": "/artists/mael.jpg", "pascalmk": "/artists/pascalmk.jpg", "innossb": "/artists/innossb.jpg"};
function seedCatalog(){
  const now=Date.now(),day=864e5,artists=ARTISTS0.map(([id,name,country,yt],i)=>({id,name,country:'DR Congo',youtube:yt,bio:BIO0[id]||`${name} is an artist from the Democratic Republic of the Congo.`,...(/claude/.test(location.hostname)?{}:{photoUrl:PHOTO0[id]}),wma:true,home:id!=='mael',hue:(i*47+20)%360,createdAt:now-i*day}));
  const albums=[],tracks=[];let n=0;
  artists.forEach((a,i)=>{const g1=GENRES0[i%7],g2=GENRES0[(i+3)%7];let al=null;
    if(i%3===0){const ts=now-(20+i*9)*day;al={id:'al'+a.id,title:'Demo EP',artistId:a.id,date:new Date(ts).toISOString().slice(0,10),type:'EP',createdAt:ts};albums.push(al)}
    for(let k=0;k<(al?3:2);k++){n++;const ts=now-(i*3+k)*day;tracks.push({id:'t'+n,title:`Demo track ${k+1} · ${k%2?g2:g1}`,artistId:a.id,featIds:[],albumId:al?al.id:null,genre:k%2?g2:g1,duration:40,status:'published',publishedAt:ts,releaseDate:new Date(ts).toISOString().slice(0,10),demo:true,rights:'demo',createdAt:ts})}});
  const by=g=>tracks.filter(t=>g.includes(t.genre)).map(t=>t.id);
  const playlists=[{id:'plrumba',name:'Rumba & Ndombolo',desc:'The official WMA selection.',trackIds:by(['Rumba','Ndombolo'])},{id:'plafro',name:'Afro Vibes',desc:'Afrobeat, afro-pop and amapiano.',trackIds:by(['Afrobeat','Afro-pop','Amapiano'])},{id:'plnew',name:'WMA New Releases',desc:'The label\'s latest releases.',trackIds:tracks.slice(0,8).map(t=>t.id)},{id:'plspirit',name:'Gospel & Rap',desc:'Two energies, one stage.',trackIds:by(['Gospel','Rap'])}].map(p=>({...p,official:true,createdAt:now}));
  return {v:3,artists,albums,tracks,playlists,genres:GENRES0.slice()};
}

/* =========================================================

let MODE='local';                 // 'local' | 'cloud' (claude.ai) | 'supa' (Supabase, ex. Vercel)
let SB=null, MYEMAIL='';
let DBX=null, ASSETS=null, USERX=null, UID=null, CAN_EDIT=false, MYNAME='';
const DB={artists:[],albums:[],tracks:[],playlists:[],videos:[],genres:GENRES0.slice()};
let PUB=null, MYARTISTS=[];   // statistiques publiques agrégées (Supabase) ; artistes accessibles dans le dashboard
let ME=null;                      // profil auditeur courant (favoris, playlists, écoutes…)

let LOCAL=null, LUSERS=[], LSESSION=null, ANON=null;
const cloud=()=>MODE!=='local', art=()=>MODE==='cloud', supa=()=>MODE==='supa';
const SUPA_IMG='music-images',SUPA_AUDIO='music-audio',SUPA_VIDEO='music-video';
const blob=id=>supa()&&/^img\//.test(id)?SB.storage.from(SUPA_IMG).getPublicUrl(id).data.publicUrl:supa()&&/^video\//.test(id)?SB.storage.from(SUPA_VIDEO).getPublicUrl(id).data.publicUrl:'/_blob/'+id;
const signed={};
async function audioSrc(id){if(!supa()||!/^audio\//.test(id))return blob(id);const c=signed[id];if(c&&c.exp>Date.now())return c.url;
  const {data,error}=await SB.storage.from(SUPA_AUDIO).createSignedUrl(id,6*3600);if(error||!data)throw new Error('nofile');signed[id]={url:data.signedUrl,exp:Date.now()+5.5*3600e3};return data.signedUrl}
const sbx=async p=>{const r=await p;if(r&&r.error)throw new Error(r.error.message||'Erreur Supabase');return r};

function normTrack(t){
  const s=t.status||(t.published===false?'unpublished':'published');
  return {featIds:[],genre:'',producer:'',writers:'',description:'',rightsNote:'',...t,status:s,featIds:Array.isArray(t.featIds)?t.featIds:[]};
}
const isLive=t=>t.status==='published'||(t.status==='scheduled'&&t.publishAt&&t.publishAt<=Date.now());
const pubDate=t=>t.status==='scheduled'?t.publishAt:(t.publishedAt||null);
const emptyMe=()=>({favs:[],follows:[],albums:[],history:[],playlists:[],listens:{},log:[],presaves:[],presaveDone:[],views:{},notifs:[],notifCheck:0,country:''});

function bootLocal(){
  MODE='local';LOCAL=store.get('catalog2',null);if(!LOCAL||LOCAL.v!==3){LOCAL=seedCatalog();store.set('catalog2',LOCAL)}
  Object.assign(DB,{artists:LOCAL.artists,albums:LOCAL.albums,tracks:LOCAL.tracks.map(normTrack),playlists:LOCAL.playlists,videos:LOCAL.videos||[],genres:LOCAL.genres});
  LUSERS=store.get('users2',[]);LSESSION=store.get('session2',null);ANON=store.get('anon2',null)||{id:'anon',...emptyMe()};
  const u=LUSERS.find(x=>x.id===LSESSION);ME=u||null;PEOPLE=[...LUSERS,ANON];
}
function saveLocalCatalog(){LOCAL.videos=DB.videos;LOCAL.tracks=DB.tracks;LOCAL.artists=DB.artists;LOCAL.albums=DB.albums;LOCAL.playlists=DB.playlists;LOCAL.genres=DB.genres;if(!store.set('catalog2',LOCAL))toast("Browser storage is full: this change was not saved.")}
const clean=o=>JSON.parse(JSON.stringify(o,(k,v)=>k==='audioUrl'||k==='_local'?undefined:v));

/* Écritures catalogue (admin) */
function upsert(kind,obj){const arr=DB[kind],i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj)}
async function putDoc(kind,obj){
  if(kind==='tracks')obj=normTrack(obj);
  upsert(kind,obj);
  if(!cloud()){saveLocalCatalog();return}
  const body=clean(obj);delete body.id;
  if(kind==='videos'){const live=obj.status==='published',to=live?'videos':'videodrafts',from=live?'videodrafts':'videos';
    if(supa()){await sbx(SB.from('music_docs').upsert({kind:to,id:obj.id,data:body}));await sbx(SB.from('music_docs').delete().eq('kind',from).eq('id',obj.id))}
    else{await DBX.collection(to).doc(obj.id).set(body);await DBX.collection(from).doc(obj.id).delete().catch(()=>{})}
    return}
  if(supa()){if(kind==='tracks'){const live=obj.status==='published'||obj.status==='scheduled',to=live?'tracks':'drafts',from=live?'drafts':'tracks';
      await sbx(SB.from('music_docs').upsert({kind:to,id:obj.id,data:body}));await sbx(SB.from('music_docs').delete().eq('kind',from).eq('id',obj.id))}
    else await sbx(SB.from('music_docs').upsert({kind,id:obj.id,data:body}));return}
  if(kind==='tracks'){const live=obj.status==='published'||obj.status==='scheduled',to=live?'tracks':'drafts',from=live?'drafts':'tracks';
    await DBX.collection(to).doc(obj.id).set(body);await DBX.collection(from).doc(obj.id).delete().catch(()=>{});}
  else await DBX.collection(kind).doc(obj.id).set(body);
}
async function delDoc(kind,id){
  DB[kind]=DB[kind].filter(x=>x.id!==id);
  if(!cloud()){saveLocalCatalog();return}
  if(supa()){await sbx(SB.from('music_docs').delete().in('kind',kind==='tracks'?['tracks','drafts']:kind==='videos'?['videos','videodrafts']:[kind]).eq('id',id));return}
  if(kind==='videos'){await DBX.collection('videos').doc(id).delete().catch(()=>{});await DBX.collection('videodrafts').doc(id).delete().catch(()=>{});return}
  if(kind==='tracks'){await DBX.collection('tracks').doc(id).delete().catch(()=>{});await DBX.collection('drafts').doc(id).delete().catch(()=>{})}
  else await DBX.collection(kind).doc(id).delete();
}
async function putGenres(){if(!cloud())return saveLocalCatalog();if(supa())return sbx(SB.from('music_docs').upsert({kind:'meta',id:'genres',data:{list:DB.genres}}));await DBX.doc('meta/genres').set({list:DB.genres})}

/* Écritures auditeur (son propre profil) */
let meTimer=null,meWriting=false,meDirty=false;
function saveMe(){
  if(!ME)return;
  if(!cloud()){if(ME===ANON)store.set('anon2',ANON);else store.set('users2',LUSERS);return}
  meDirty=true;clearTimeout(meTimer);meTimer=setTimeout(flushMe,400);
}
async function flushMe(){
  if(meWriting||!meDirty||!UID)return;meWriting=true;meDirty=false;
  const body=clean({favs:ME.favs,follows:ME.follows,albums:ME.albums,history:ME.history.slice(0,100),playlists:ME.playlists,listens:ME.listens,log:ME.log.slice(-400),presaves:ME.presaves||[],presaveDone:(ME.presaveDone||[]).slice(-200),views:ME.views||{},notifs:(ME.notifs||[]).slice(0,50),notifCheck:ME.notifCheck||0,country:ME.country||'',subSeen:ME.subSeen||{},updatedAt:Date.now()});
  try{if(supa())await sbx(SB.from('music_people').upsert({user_id:UID,data:body,updated_at:new Date().toISOString()}));else await DBX.doc('people/'+UID).set(body)}catch(e){if(!flushMe.warned){flushMe.warned=1;toast(e&&e.code==='quota_exceeded'?'Storage is full.':"Your favourites and plays can't be saved with your access level.")}}
  meWriting=false;if(meDirty)flushMe();
}

/* Fichiers : stockage serveur (cloud) ou session (local) */
async function uploadFile(b,type,o={}){
  if(supa()&&o.video){const ext={'video/mp4':'mp4','video/webm':'webm','video/quicktime':'mov'}[type]||'mp4',path='video/'+(crypto.randomUUID?crypto.randomUUID():uid('f'))+'.'+ext;
    const r=await SB.storage.from(SUPA_VIDEO).upload(path,b,{contentType:type,cacheControl:'31536000',upsert:false});
    if(r.error)throw new Error(/size|large/i.test(r.error.message)?'This video is too large for storage (50 MB maximum).':/row-level|policy|permission|Unauthorized/i.test(r.error.message)?"Upload refused: your account is not an administrator.":"The upload failed: "+r.error.message);
    return {id:path}}
  if(supa()){const img=/^image\//.test(type),ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','video/mp4':'m4a','video/webm':'webm','audio/mpeg':'mp3','audio/mp4':'m4a','audio/x-m4a':'m4a','audio/aac':'aac','audio/ogg':'ogg','audio/webm':'webm','audio/flac':'flac','audio/wav':'wav'}[type]||'bin';
    const path=(img?'img/':'audio/')+(crypto.randomUUID?crypto.randomUUID():uid('f'))+'.'+ext;
    const r=await SB.storage.from(img?SUPA_IMG:SUPA_AUDIO).upload(path,b,{contentType:type,cacheControl:'31536000',upsert:false});
    if(r.error)throw new Error(/size|large/i.test(r.error.message)?'This file is too large for storage.':/row-level|policy|permission|Unauthorized/i.test(r.error.message)?"Upload refused: your account is not an administrator.":"The upload failed: "+r.error.message);
    return {id:path}}
  if(cloud()){if(!ASSETS)throw new Error("File storage isn't available with your access level (Editor required).");
    try{const r=await ASSETS.upload(b,{type});return {id:r.id}}catch(e){throw new Error({too_large:'File too large (20 MB maximum).',quota_or_state:'Storage is full: delete unused files.',unsupported_type:'This file format was refused by the storage.'}[e&&e.code]||"The upload failed. Please try again.")}}
  return {local:URL.createObjectURL(b)};
}
async function dropFile(id){if(!id)return;if(supa()){try{await SB.storage.from(/^img\//.test(id)?SUPA_IMG:/^video\//.test(id)?SUPA_VIDEO:SUPA_AUDIO).remove([id])}catch(e){}return}if(cloud()&&ASSETS){try{await ASSETS.delete(id)}catch(e){}}}

/* Lecture */
const api={
  me:()=>ME&&ME!==ANON?ME:null,
  isAdmin:()=>cloud()?CAN_EDIT:!!(ME&&ME!==ANON&&ME.role==='admin'),
  artist:id=>DB.artists.find(a=>a.id===id),
  album:id=>DB.albums.find(a=>a.id===id),
  track:id=>DB.tracks.find(t=>t.id===id),
  pub:()=>DB.tracks.filter(isLive),
  tracksOf:aid=>api.pub().filter(t=>t.artistId===aid||t.featIds.includes(aid)),
  albumTracks:alid=>api.pub().filter(t=>t.albumId===alid).sort((a,b)=>(a.trackNo||0)-(b.trackNo||0)||a.createdAt-b.createdAt),
  myPlaylists:()=>api.me()?(ME.playlists||[]).map(p=>({...p,official:false,mine:true})):[],
  playlists:()=>[...DB.playlists.map(p=>({...p,official:true})),...api.myPlaylists()],
  playlist:id=>api.playlists().find(p=>p.id===id)
};
/* Statistiques — uniquement à partir des profils réellement enregistrés */
const stat={
  plays:tid=>PEOPLE.reduce((s,p)=>s+((p.listens||{})[tid]?.n||0),0),
  listeners:tid=>PEOPLE.filter(p=>(p.listens||{})[tid]?.n).length,
  favs:tid=>PEOPLE.filter(p=>(p.favs||[]).includes(tid)).length,
  inPlaylists:tid=>DB.playlists.filter(p=>p.trackIds.includes(tid)).length+PEOPLE.reduce((s,p)=>s+(p.playlists||[]).filter(x=>x.trackIds.includes(tid)).length,0),
  artistPlays:aid=>DB.tracks.filter(t=>t.artistId===aid||t.featIds.includes(aid)).reduce((s,t)=>s+stat.plays(t.id),0),
  followers:aid=>PEOPLE.filter(p=>(p.follows||[]).includes(aid)).length,
  total:()=>PEOPLE.reduce((s,p)=>s+Object.values(p.listens||{}).reduce((a,l)=>a+(l.n||0),0),0),
  listenersAll:()=>PEOPLE.filter(p=>Object.keys(p.listens||{}).length).length,
  log:()=>PEOPLE.flatMap(p=>p.log||[])
};

/* ---------- Démarrage cloud ---------- */

function playsChart(){

  const top=Math.max(4,Math.ceil(max/4)*4),W=720,H=220,L=36,R=12,T=12,B=28,x=i=>L+i*(W-L-R)/13,y=v=>T+(H-T-B)*(1-v/top),pts=days.map((d,i)=>`${x(i)},${y(d.n)}`).join(' ');
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:480px" role="img" aria-label="Plays per day">
   ${[0,.25,.5,.75,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${y(top*f)}" y2="${y(top*f)}" stroke="#2C2C2E"/><text x="${L-8}" y="${y(top*f)+4}" fill="#8E8E93" font-size="11" text-anchor="end" font-family="ui-monospace,monospace">${top*f}</text>`).join('')}
   <polygon points="${x(0)},${y(0)} ${pts} ${x(13)},${y(0)}" fill="rgba(255,122,26,.20)"/><polyline points="${pts}" fill="none" stroke="#FF7A1A" stroke-width="2.5" stroke-linejoin="round"/>
   ${days.map((d,i)=>`${i%2===1||i===13?`<text x="${x(i)}" y="${H-8}" fill="#8E8E93" font-size="11" text-anchor="middle" font-family="ui-monospace,monospace">${new Date(d.s).toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit'})}</text>`:''}${d.n?`<circle cx="${x(i)}" cy="${y(d.n)}" r="${i===13?5:3}" fill="#FF7A1A"><title>${d.n} play(s)</title></circle>`:''}`).join('')}</svg></div>`;
}

function parsePhotoList(txt){
  txt=txt.trim();if(!txt)return [];
  if(/^[\[{]/.test(txt)){let d=JSON.parse(txt);if(!Array.isArray(d))d=d.artists||d.data||Object.entries(d).map(([name,url])=>({name,url}));
    return d.map(o=>({id:o.id??o.slug??null,name:o.name??o.nom??o.artist_name??o.full_name??'',url:o.photo_url??o.photoUrl??o.avatar_url??o.image_url??o.image??o.photo??o.url??''}))}
  return txt.split(/\r?\n/).filter(l=>l.trim()&&!/^\s*(nom|name)\s*[,;]/i.test(l)).map(l=>{const p=l.split(/[;,\t]/);return {id:null,name:(p[0]||'').trim(),url:(p.slice(1).join(',')||'').trim()}});
}

function cdText(ts){let d=Math.max(0,ts-Date.now());const D=Math.floor(d/864e5);d-=D*864e5;const H=Math.floor(d/36e5);d-=H*36e5;const M=Math.floor(d/6e4);const S=Math.floor((d-M*6e4)/1e3);
  return `<span><b>${D}</b>d</span><span><b>${String(H).padStart(2,'0')}</b>h</span><span><b>${String(M).padStart(2,'0')}</b>m</span><span><b>${String(S).padStart(2,'0')}</b>s</span>`}

/* Notifications : sorties pré-enregistrées et nouveautés des artistes suivis */
function notify(n){const m=api.me();if(!m)return;m.notifs=m.notifs||[];if(m.notifs.some(x=>x.key===n.key))return;m.notifs.unshift({...n,ts:Date.now(),read:false});m.notifs=m.notifs.slice(0,50);

  for(const tid of (m.presaves||[])){const t=api.track(tid);if(t&&isLive(t)&&!m.presaveDone.includes(tid)){m.presaveDone.push(tid);if(!m.favs.includes(tid))m.favs.unshift(tid);
    notify({key:'rel-'+tid,tid,text:`“${t.title}” by ${artistText(t)} is out now. It's in your favourites.`});ch=true}}
  const since=m.notifCheck||0,now=Date.now();
  if(since){for(const t of api.pub()){const d=pubDate(t)||t.createdAt;if(d>since&&d<=now&&(m.follows||[]).some(a=>a===t.artistId||t.featIds.includes(a))&&!(m.presaves||[]).includes(t.id)){notify({key:'new-'+t.id,tid:t.id,text:`New release: “${t.title}” by ${artistText(t)}.`});ch=true}}}
  if(m.notifCheck!==now){m.notifCheck=now;ch=true}if(ch)saveMe()}

  if(!canStudio())return `<div class="auth"><h1>WMA Artist Dashboard</h1><p class="muted">This space is for WMA artists and their teams. Ask the WMA team to link your account to your artist profile.</p><div class="actions"><a class="btn" href="#home">Back to home</a></div></div>`;
  const list=studioArtists();if(!list.length)return `<div class="empty">No artist is linked to your account yet.</div>`;
  if(!STUDIO.aid||!list.some(a=>a.id===STUDIO.aid)){setTimeout(()=>loadStudio(list[0].id),0);STUDIO.aid=list[0].id}
  else if(!STUDIO.data&&!STUDIO.loading&&!STUDIO.err)setTimeout(()=>loadStudio(STUDIO.aid),0);
  const a=api.artist(STUDIO.aid),r=STUDIO.data;
  const head=`<div class="eyebrow">WMA Artist Dashboard</div><div class="studio-head"><h1 class="ltitle" style="margin:4px 0 0">${a?vName(a):''}</h1>
    ${list.length>1?`<select id="stArtist" aria-label="Choose an artist">${list.map(x=>`<option value="${x.id}" ${x.id===STUDIO.aid?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}
    <button class="btn sm" data-act="stRefresh">Refresh</button></div>`;
  if(STUDIO.err)return head+`<div class="empty" style="margin-top:20px">${esc(STUDIO.err)}</div>`;
  if(!r)return head+`<div class="empty" style="margin-top:20px">Loading the statistics…</div>`;
  const trs=(r.trackIds||[]).map(api.track).filter(Boolean).map(t=>({t,s:(r.tracks[t.id]||{}).streams||0,l:(r.tracks[t.id]||{}).listeners||0,f:r.favs[t.id]||0,p:r.presaves[t.id]||0})).sort((x,y)=>y.s-x.s||y.f-x.f);
  const ctry=Object.entries(r.countries||{}).map(([c,v])=>({c,s:v.streams||0,l:v.listeners||0})).filter(x=>x.s||x.l).sort((x,y)=>y.s-x.s),cmax=ctry[0]?.s||1;
  const presaves=Object.values(r.presaves||{}).reduce((s,n)=>s+n,0),favs=Object.values(r.favs||{}).reduce((s,n)=>s+n,0);
  return head+`<p class="muted" style="font-size:12.5px;margin:6px 0 16px">Real data from WMA MUSIC listeners · updated ${frDT(r.at||Date.now())}</p>
   <div class="kpis"><div class="kpi"><b>${nf(r.streams)}</b><span>Streams</span></div><div class="kpi"><b>${nf(r.listeners)}</b><span>Listeners</span></div><div class="kpi"><b>${nf(r.followers)}</b><span>Followers</span></div><div class="kpi"><b>${nf(favs)}</b><span>Favourites</span></div><div class="kpi"><b>${nf(presaves)}</b><span>Pre-saves</span></div></div>
   <div class="panel" style="margin-top:16px"><div class="studio-head"><h3 style="font-size:17px">Streams over time</h3><div class="chips">${[7,30,90].map(n=>`<button class="chip ${STUDIO_DAYS===n?'on':''}" data-act="stDays" data-n="${n}">${n} days</button>`).join('')}</div></div>${daysChart(r.days,STUDIO_DAYS)}</div>
   <div class="panel" style="margin-top:16px"><div class="studio-head"><h3 style="font-size:17px">Songs ranking</h3><button class="btn sm" data-act="stCsv" data-r="songs">${FI.down} Download CSV</button></div>
    ${trs.length?`<div class="tbl-wrap"><table><thead><tr><th>#</th><th></th><th>Song</th><th>Status</th><th>Streams</th><th>Listeners</th><th>Favourites</th><th>Pre-saves</th></tr></thead><tbody>${trs.map((x,i)=>`<tr><td class="mono">${i+1}</td><td><img src="${trackCover(x.t)}" alt=""></td><td><b>${esc(x.t.title)}</b><div class="t2">${esc(artistText(x.t))}</div></td><td>${statusBadge(x.t)}</td><td class="mono">${nf(x.s)}</td><td class="mono">${nf(x.l)}</td><td class="mono">${nf(x.f)}</td><td class="mono">${nf(x.p)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No songs yet.</div>'}</div>
   <div class="panel" style="margin-top:16px"><div class="studio-head"><h3 style="font-size:17px">Listeners by country</h3><button class="btn sm" data-act="stCsv" data-r="countries">${FI.down} Download CSV</button></div>
    ${ctry.length?`<div class="bars">${ctry.map(x=>`<div class="bar"><div style="min-width:0"><div class="t1" style="font-size:13px">${flag(x.c)} ${esc(regionName(x.c))} <span class="muted">· ${nf(x.l)} listener${x.l===1?'':'s'}</span></div><i style="width:${x.s/cmax*100}%"></i></div><span class="mono" style="text-align:right">${nf(x.s)}</span></div>`).join('')}</div>
     <p class="muted" style="font-size:12px;margin:12px 0 0">Country is detected from each listener's connection when they use WMA MUSIC. “Unknown” covers listeners whose country could not be detected.</p>`:'<div class="empty">No listeners yet.</div>'}</div>
   <div class="actions"><button class="btn" data-act="stCsv" data-r="days">${FI.down} Daily streams (CSV)</button></div>`;
};
function csvDownload(name,rows){const csv=rows.map(r=>r.map(v=>{const s=String(v??'');return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\r\n');
  if(MODE==='cloud'&&window.claude&&claude.use){claude.use('downloads').then(d=>{if(!d)return toast("Downloads aren't available here");return d.save({filename:name,data:new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})}).then(()=>toast('Report downloaded'))}).catch(()=>toast('Download cancelled'));return}
  const b=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},500);toast('Report downloaded')}
function studioCsv(kind){const r=STUDIO.data,a=api.artist(STUDIO.aid);if(!r||!a)return;const day=today(),slug=key(a.name)||a.id;
  if(kind==='songs')csvDownload(`wma-${slug}-songs-${day}.csv`,[['Rank','Song','Artists','Album','Status','Release date','Streams','Listeners','Favourites','Pre-saves'],...(r.trackIds||[]).map(api.track).filter(Boolean).map(t=>({t,s:(r.tracks[t.id]||{}).streams||0})).sort((x,y)=>y.s-x.s).map((x,i)=>[i+1,x.t.title,artistText(x.t),x.t.albumId?api.album(x.t.albumId)?.title||'':'Single',x.t.status,x.t.releaseDate||'',x.s,(r.tracks[x.t.id]||{}).listeners||0,r.favs[x.t.id]||0,r.presaves[x.t.id]||0])]);
  if(kind==='countries')csvDownload(`wma-${slug}-countries-${day}.csv`,[['Country','Code','Streams','Listeners'],...Object.entries(r.countries||{}).sort((x,y)=>(y[1].streams||0)-(x[1].streams||0)).map(([c,v])=>[regionName(c),c,v.streams||0,v.listeners||0])]);
  if(kind==='days'){const rows=[['Date','Streams']],d0=new Date();d0.setUTCHours(0,0,0,0);for(let i=89;i>=0;i--){const d=new Date(d0.getTime()-i*864e5).toISOString().slice(0,10);rows.push([d,+(r.days||{})[d]||0])}csvDownload(`wma-${slug}-daily-streams-${day}.csv`,rows)}}

function videoForm(id){const v=id?api.video(id):null;

    <div class="seg" role="radiogroup" style="grid-template-columns:repeat(2,1fr)">${[['youtube','YouTube link'],['file','Upload a file']].map(([k,l])=>`<label><input type="radio" name="vSrc" value="${k}" ${(v?.source||'youtube')===k?'checked':''}><span>${l}</span></label>`).join('')}</div>

    <div class="drop" id="vFileWrap"><label for="vFile">${I.upload}<span><b>${v?.fileId?'Replace the video file':'Video file *'}</b><small>MP4 or WebM · ${supa()?'50':'20'} MB maximum</small></span></label><input id="vFile" type="file" accept="video/mp4,video/webm,video/quicktime"></div>

    <div class="seg" role="radiogroup" style="grid-template-columns:repeat(2,1fr)">${[['published','Publish now'],['draft','Save as draft']].map(([k,l])=>`<label><input type="radio" name="vStatus" value="${k}" ${(v?.status||'published')===k?'checked':''}><span>${l}</span></label>`).join('')}</div></fieldset>

  const fillTracks=()=>{const aid=$('#vArtist').value,cur=$('#vTrack').value||v?.trackId||'';$('#vTrack').innerHTML='<option value="">No linked song</option>'+DB.tracks.filter(t=>!aid||t.artistId===aid||t.featIds.includes(aid)).map(t=>`<option value="${t.id}" ${t.id===cur?'selected':''}>${esc(t.title)}</option>`).join('')};
  const src=()=>document.querySelector('input[name=vSrc]:checked').value,sync=()=>{$('#vYtWrap').hidden=src()!=='youtube';$('#vFileWrap').hidden=src()!=='file'};
  fillTracks();sync();$('#vArtist').onchange=fillTracks;document.querySelectorAll('input[name=vSrc]').forEach(r=>r.onchange=sync);
  $('#vForm').onsubmit=async e=>{e.preventDefault();const err=$('#vErr'),btn=$('#vSubmit');err.textContent='';

    if(!title)return err.textContent='Enter the video title.';if(!artistId)return err.textContent='Choose the artist.';
    if(s==='youtube'&&!yid)return err.textContent='Paste a valid YouTube link (watch, youtu.be, shorts or live).';
    if(s==='file'&&!file&&!v?.fileId)return err.textContent='Choose the video file to upload.';
    if(file&&file.size>(supa()?50:20)*1048576)return err.textContent=`This file is too large (${supa()?'50':'20'} MB maximum). Use a YouTube link instead.`;
    if(!$('#vRights').checked)return err.textContent='Confirm that WMA holds the rights to publish this video.';
    btn.disabled=true;$('#vForm').dataset.busy='1';
    try{let fileId=v?.fileId||null,thumb={};
      if(s==='file'&&file){btn.textContent='Uploading the video…';const r=await uploadFile(file,file.type||'video/mp4',{video:true});fileId=r.id||null;if(r.local)thumb.localUrl=r.local}
      const ti=await readImg($('#vThumb').files[0],1600);if(ti){btn.textContent='Uploading the thumbnail…';const r=await storeImage(ti);thumb=r.coverId?{thumbId:r.coverId,thumb:null}:{thumb:r.cover,thumbId:null}}
      btn.textContent='Saving…';const now=Date.now(),status=document.querySelector('input[name=vStatus]:checked').value;
      const data={...(v||{id:uid('v'),createdAt:now}),title,artistId,trackId:$('#vTrack').value||null,type:document.querySelector('input[name=vType]:checked').value,source:s,youtubeId:s==='youtube'?yid:null,fileId:s==='file'?fileId:null,
        desc:$('#vDesc').value.trim(),status,publishedAt:status==='published'?(v?.publishedAt||now):null,updatedAt:now,...thumb};
      if(thumb.localUrl){data.fileUrl=thumb.localUrl;delete data.localUrl}
      await putDoc('videos',data);if(v&&v.fileId&&v.fileId!==data.fileId)dropFile(v.fileId);if(v&&thumb.thumbId&&v.thumbId&&v.thumbId!==thumb.thumbId)dropFile(v.thumbId);
      delete $('#vForm').dataset.busy;closeModal();toast(status==='published'?'Video published':'Video saved as draft');rerender()}
    catch(x){err.textContent=x.message||'Saving failed.';btn.disabled=false;btn.textContent='Save';delete $('#vForm').dataset.busy}};
}

const lsGet=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
